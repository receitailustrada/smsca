<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cruz Alta 3D: maquete voxel da cidade de Cruz Alta (RS) com os bairros oficiais do IBGE, ruas e prédios do OpenStreetMap e a rede de saúde da APS Cruz Alta.">
<title>Cruz Alta 3D · APS Cruz Alta</title>
<script>
  /* Detecta embutido (Apps Script/HtmlService sempre roda em iframe; Google Sites também). */
  try { if (window.self !== window.top) document.documentElement.classList.add('embutido'); }
  catch (e) { document.documentElement.classList.add('embutido'); }
  try {
    var temaSalvo = localStorage.getItem('ca3d.tema');
    if (temaSalvo === 'escuro') document.documentElement.setAttribute('data-tema', 'escuro');
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Cruz Alta 3D · identidade APS Cruz Alta
   Faixa: turquesa, verde, amarelo, laranja, magenta · Montserrat 400-700
   ===================================================================== */
:root{
  --zoom:1;
  --fs:calc(13.5px * var(--zoom));
  --lw-aberto:316px; --rw-aberto:372px;
  --lw:var(--lw-aberto); --rw:var(--rw-aberto);
  --trilho-e:64px; --trilho-d:54px;

  --aps-teal:#56B8BE; --aps-verde:#4DAA57; --aps-amarelo:#F2B632; --aps-laranja:#ED713B; --aps-magenta:#D61D5C; --aps-azul:#3B64AD;
  --marca:#2A9A7F; --marca-escura:#1E7A64; --marca-clara:#E5F5F0;
  --marca-grad:linear-gradient(135deg,#4DAA57 0%,#56B8BE 100%);
  --cta:#ED713B; --cta-escura:#D2581F; --cta-clara:#FDEEE6;
  --cta-grad:linear-gradient(135deg,#F58A4B 0%,#E9602D 100%);
  --navy:#0F1D33;

  --bg:#F3F6F8; --bg-ponto:rgba(15,29,51,.075);
  --card:#FFFFFF; --card-2:#F7FAFB; --card-3:#EDF2F5;
  --borda:#E1E8ED; --borda-2:#CBD6DE;
  --tinta:#13233A; --tinta-2:#42536A; --tinta-3:#677789;

  --ok:#2E9D55; --ok-clara:#E4F4EA;
  --alerta:#B97F04; --alerta-clara:#FFF4DA;
  --erro:#D23B3B; --erro-clara:#FCE8E8;
  --info:#2F6FD0; --info-clara:#E7EFFC;

  --sombra:0 12px 32px rgba(15,29,51,.12);
  --sombra-2:0 2px 8px rgba(15,29,51,.08);
  --raio:16px; --raio-m:12px; --raio-s:9px;
  --foco:0 0 0 3px rgba(86,184,190,.45);
  --hud-bg:rgba(255,255,255,.93); --hud-borda:rgba(15,29,51,.12);
}
html[data-tema="escuro"]{
  color-scheme:dark;
  --marca:#4CC3A6; --marca-escura:#7AD8C1; --marca-clara:#123029;
  --cta:#F2864F; --cta-escura:#F6A274; --cta-clara:#3A2216;
  --bg:#0B1421; --bg-ponto:rgba(255,255,255,.05);
  --card:#122033; --card-2:#16263B; --card-3:#1C2D44;
  --borda:#24364F; --borda-2:#2F4563;
  --tinta:#E8EEF6; --tinta-2:#B6C3D3; --tinta-3:#8B9BB0;
  --ok:#4CC27A; --ok-clara:#123222;
  --alerta:#F0B429; --alerta-clara:#33280C;
  --erro:#F06B6B; --erro-clara:#3A1717;
  --info:#6AA1FF; --info-clara:#13264A;
  --sombra:0 12px 32px rgba(0,0,0,.45);
  --sombra-2:0 2px 8px rgba(0,0,0,.35);
  --hud-bg:rgba(18,32,51,.93); --hud-borda:rgba(255,255,255,.12);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  font-size:var(--fs);line-height:1.42;color:var(--tinta);background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
html.embutido body{min-height:0;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
.ic{width:1.2em;height:1.2em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;display:inline-block}
.ic-g{width:1.45em;height:1.45em}
.sr{position:absolute !important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Estrutura fixa (sem vh, sem zoom no body) ---------- */
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
  background-color:var(--bg);
  background-image:radial-gradient(var(--bg-ponto) 1px,transparent 1.3px);
  background-size:18px 18px;
}
#app.esq-off{--lw:var(--trilho-e)}
#app.dir-off{--rw:var(--trilho-d)}

/* ---------- Topo ---------- */
#topo{flex:none;display:flex;align-items:center;gap:.6em;padding:.5em .85em;background:var(--card);position:relative;z-index:40;min-width:0}
.faixa-aps{flex:none;height:4px;background:linear-gradient(90deg,var(--aps-teal) 0 20%,var(--aps-verde) 20% 40%,var(--aps-amarelo) 40% 60%,var(--aps-laranja) 60% 80%,var(--aps-magenta) 80% 100%)}
.btn-ic{display:inline-grid;place-items:center;width:2.65em;height:2.65em;flex:none;border-radius:var(--raio-s);border:1px solid var(--borda);background:var(--card);color:var(--tinta-2);transition:background .15s,color .15s,border-color .15s;padding:0}
.btn-ic:hover{background:var(--card-3);color:var(--tinta)}
.btn-ic:focus-visible,.btn:focus-visible,.chip:focus-visible,.trilho-btn:focus-visible,.aba:focus-visible,.aba-vertical:focus-visible,.item-lista:focus-visible{outline:none;box-shadow:var(--foco)}
.btn-ic.ativo{background:var(--marca-clara);color:var(--marca);border-color:var(--marca)}
.marca{display:flex;align-items:center;gap:.55em;min-width:0;flex:none}
.brasao{width:2.75em;height:2.75em;object-fit:contain;flex:none}
.brasao-alt{width:2.75em;height:2.75em;border-radius:12px;background:var(--marca-grad);color:#fff;font-weight:700;display:none;place-items:center;flex:none;letter-spacing:.02em}
.brasao.falhou{display:none}
.brasao.falhou + .brasao-alt{display:grid}
.marca-txt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.marca-txt strong{font-size:1.14em;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.eyebrow{font-size:.72em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3);white-space:nowrap}
.busca{position:relative;flex:1 1 300px;max-width:520px;min-width:0;margin-left:auto}
.busca input{width:100%;height:2.65em;padding:0 2.5em 0 2.45em;border-radius:999px;border:1.5px solid var(--borda);background:var(--card-2);outline:none;transition:border-color .15s,box-shadow .15s}
.busca input::-webkit-search-cancel-button{display:none}
.busca input:focus{border-color:var(--aps-teal);box-shadow:var(--foco);background:var(--card)}
.busca .lupa{position:absolute;left:.85em;top:50%;transform:translateY(-50%);color:var(--tinta-3);pointer-events:none}
.busca kbd{position:absolute;right:.75em;top:50%;transform:translateY(-50%);font-family:inherit;font-size:.78em;font-weight:700;color:var(--tinta-3);border:1px solid var(--borda-2);border-radius:6px;padding:.05em .45em;background:var(--card);pointer-events:none}
.resultados{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;background:var(--card);border:1px solid var(--borda);border-radius:var(--raio-m);box-shadow:var(--sombra);max-height:420px;overflow-y:auto;overscroll-behavior:contain;padding:.35em}
.res-item{display:flex;align-items:center;gap:.65em;width:100%;padding:.55em .6em;border:0;border-radius:10px;background:transparent;text-align:left}
.res-item:hover,.res-item.ativo{background:var(--card-3)}
.res-item .res-ic{width:2.1em;height:2.1em;border-radius:9px;display:grid;place-items:center;background:var(--card-3);color:var(--tinta-2);flex:none}
.res-item .res-tit{font-weight:700;line-height:1.2}
.res-item .res-sub{font-size:.82em;color:var(--tinta-3)}
.res-vazio{padding:.8em;color:var(--tinta-3);font-size:.9em}
.chip-fonte{display:inline-flex;align-items:center;gap:.45em;height:2.35em;padding:0 .85em;border-radius:999px;border:1.5px solid var(--borda);background:var(--card);font-size:.84em;font-weight:600;color:var(--tinta-2);white-space:nowrap;flex:none}
.chip-fonte .ponto{width:.62em;height:.62em;border-radius:50%;background:var(--tinta-3);flex:none}
.chip-fonte[data-estado="osm"] .ponto{background:var(--ok)}
.chip-fonte[data-estado="ilustrativo"] .ponto{background:var(--aps-amarelo)}
.chip-fonte[data-estado="baixando"] .ponto,.chip-fonte[data-estado="carregando"] .ponto{background:var(--info);animation:pulso 1s infinite}
.chip-fonte[data-estado="erro"] .ponto{background:var(--erro)}
.estado-salvo{font-size:.8em;color:var(--tinta-3);white-space:nowrap;flex:none}
.grupo-zoom{display:inline-flex;border:1px solid var(--borda);border-radius:var(--raio-s);overflow:hidden;flex:none}
.grupo-zoom button{border:0;background:var(--card);height:2.55em;padding:0 .7em;font-weight:700;color:var(--tinta-2)}
.grupo-zoom button:hover{background:var(--card-3)}
.grupo-zoom button + button{border-left:1px solid var(--borda)}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- Corpo em três colunas ---------- */
#corpo{flex:1;min-height:0;display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);position:relative;transition:grid-template-columns .22s ease}
#app.redimensionando #corpo{transition:none}
#app.redimensionando{cursor:col-resize;user-select:none}
.painel{position:relative;min-width:0;min-height:0;display:flex;background:var(--card);z-index:20}
#painelEsq{border-right:1px solid var(--borda)}
#painelDir{border-left:1px solid var(--borda)}
.painel .trilho{display:none;flex-direction:column;align-items:center;gap:.3em;padding:.55em 0 .8em;width:100%;overflow-y:auto;overscroll-behavior:contain}
.painel-conteudo{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--card)}
#app.esq-off #painelEsq .trilho,#app.dir-off #painelDir .trilho{display:flex}
#app.esq-off #painelEsq .painel-conteudo,#app.dir-off #painelDir .painel-conteudo{display:none}
.painel-cab{flex:none;display:flex;align-items:center;gap:.55em;padding:.7em .85em;border-bottom:1px solid var(--borda);min-width:0}
.painel-cab .tit{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.2}
.painel-cab .tit strong{font-size:1.02em}
.painel-rolagem{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:.85em .85em 3.2em;position:relative}
.redim{position:absolute;top:0;bottom:0;width:12px;z-index:26;cursor:col-resize;touch-action:none}
#painelEsq .redim{right:-6px}
#painelDir .redim{left:-6px}
.redim::after{content:'';position:absolute;top:50%;left:50%;width:4px;height:44px;border-radius:4px;transform:translate(-50%,-50%);background:var(--borda-2);opacity:0;transition:opacity .15s}
.redim:hover::after,.redim.ativo::after{opacity:1}

/* Trilhos */
.trilho-btn{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--tinta-2);flex:none;padding:0}
.trilho-btn:hover{background:var(--card-3);color:var(--tinta)}
.trilho-btn.ativo{background:var(--marca-clara);color:var(--marca)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--cta);color:#fff;font-size:10.5px;font-weight:700;display:inline-grid;place-items:center;line-height:1}
.trilho-btn .badge{position:absolute;top:1px;right:-2px}
.trilho-sep{width:30px;height:1px;background:var(--borda);margin:.25em 0;flex:none}
.trilho-pontos{display:flex;flex-direction:column;gap:5px;align-items:flex-start;padding:2px 0}
.trilho-ponto{display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--tinta-3);border:0;background:transparent;padding:2px 4px;border-radius:6px}
.trilho-ponto:hover{background:var(--card-3)}
.trilho-ponto i{width:10px;height:10px;border-radius:50%;display:block}
.aba-vertical{position:relative;writing-mode:vertical-rl;transform:rotate(180deg);padding:.95em .5em;border-radius:10px;border:1px solid transparent;background:transparent;font-weight:700;font-size:.78em;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3);flex:none;white-space:nowrap}
.aba-vertical:hover{background:var(--card-3);color:var(--tinta)}
.aba-vertical.ativa{color:var(--marca);background:var(--marca-clara)}
.aba-vertical .badge{position:absolute;bottom:-4px;left:-3px;transform:rotate(180deg);writing-mode:horizontal-tb}

/* Abas do painel direito */
.abas{display:flex;gap:.2em;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{position:relative;border:0;background:transparent;padding:.5em .65em;border-radius:9px;font-weight:700;font-size:.86em;color:var(--tinta-3);white-space:nowrap;display:inline-flex;align-items:center;gap:.4em}
.aba:hover{background:var(--card-3);color:var(--tinta)}
.aba.ativa{color:var(--marca);background:var(--marca-clara)}
.aba .badge{min-width:16px;height:16px;font-size:9.5px}

/* ---------- Centro: palco 3D ---------- */
#centro{position:relative;min-width:0;min-height:0;overflow:hidden;background:#7DB9DA}
#palco{position:absolute;inset:0;outline:none}
#palco canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#palco.posicionando canvas{cursor:crosshair}
#rotulos{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.rot-bairro{position:absolute;left:0;top:0;font-weight:700;font-size:.74em;letter-spacing:.09em;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.65),0 0 7px rgba(0,0,0,.4);white-space:nowrap;will-change:transform;user-select:none;pointer-events:none}
.rot-bairro.sel{color:#FFE0CF;font-size:.86em}
.rot-local{position:absolute;left:0;top:0;font-weight:600;font-size:.7em;color:#0F1D33;background:rgba(255,255,255,.86);border-radius:6px;padding:.1em .4em;white-space:nowrap;will-change:transform;pointer-events:none}
.pino{position:absolute;left:0;top:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;cursor:pointer;will-change:transform;border:0;background:transparent;padding:0;font:inherit;color:inherit}
.pino-chip{display:flex;align-items:center;gap:.35em;padding:.2em .6em .2em .22em;border-radius:999px;background:var(--hud-bg);border:2px solid var(--cor,#2E9D55);box-shadow:var(--sombra-2);font-weight:700;font-size:.76em;color:var(--tinta);white-space:nowrap;transition:transform .15s}
.pino-ic{width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;background:var(--cor,#2E9D55);color:#fff;flex:none}
.pino-ic .ic{width:1em;height:1em;stroke-width:2.4}
.pino-nome{display:none;font-weight:600;color:var(--tinta-2)}
.pino:hover .pino-nome,.pino.sel .pino-nome,#rotulos.perto .pino-nome{display:inline}
.pino-haste{width:2px;height:12px;background:var(--cor,#2E9D55)}
.pino.aprox .pino-chip{border-style:dashed}
.pino.sel{z-index:3}
.pino.sel .pino-chip{transform:scale(1.1);box-shadow:0 0 0 4px rgba(237,113,59,.35),var(--sombra-2)}
.pino:focus-visible .pino-chip{box-shadow:var(--foco)}

.hud{position:absolute;z-index:8;display:flex;gap:.4em}
.hud-ie{left:12px;bottom:12px;flex-direction:column;align-items:flex-start}
.hud-id{right:12px;bottom:12px;flex-direction:column}
.hud-btn{width:2.75em;height:2.75em;border-radius:12px;border:1px solid var(--hud-borda);background:var(--hud-bg);color:var(--tinta-2);display:grid;place-items:center;box-shadow:var(--sombra-2);padding:0}
.hud-btn:hover{color:var(--tinta)}
.hud-btn.ativo{color:var(--marca);border-color:var(--marca)}
.bussola{width:3.1em;height:3.1em;border-radius:50%;border:1px solid var(--hud-borda);background:var(--hud-bg);box-shadow:var(--sombra-2);display:grid;place-items:center;padding:0;position:relative}
.bussola svg{width:2.3em;height:2.3em;transition:transform .08s linear}
.legenda{border-radius:12px;border:1px solid var(--hud-borda);background:var(--hud-bg);box-shadow:var(--sombra-2);padding:.45em .65em;font-size:.76em;display:flex;flex-direction:column;gap:.25em;max-width:240px}
.legenda .lin{display:flex;align-items:center;gap:.45em;white-space:nowrap}
.legenda i{width:.85em;height:.85em;border-radius:3px;display:block;flex:none}
.hora-rapida{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:.55em;padding:.4em .55em .4em .8em;border-radius:999px;background:var(--hud-bg);border:1px solid var(--hud-borda);box-shadow:var(--sombra-2);max-width:calc(100% - 140px)}
.hora-rapida input[type=range]{width:min(240px,28vw);accent-color:var(--aps-laranja)}
.hora-rapida .hora-txt{font-weight:700;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
.hora-rapida .btn-ic{width:2.2em;height:2.2em;border-radius:50%}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:9;max-width:calc(100% - 24px);display:flex;align-items:center;gap:.6em;padding:.45em .5em .45em .85em;border-radius:14px;background:var(--hud-bg);border:1px solid var(--hud-borda);box-shadow:var(--sombra-2);font-size:.85em;line-height:1.3}
.banner .ic{color:var(--alerta)}
.banner.pos .ic{color:var(--cta)}
.banner .txt{min-width:0}
.banner .txt b{font-weight:700}
.banner .btn{white-space:nowrap;flex:none}
.chip-baixando{position:absolute;top:12px;right:12px;z-index:9;display:flex;align-items:center;gap:.55em;padding:.45em .5em .45em .75em;border-radius:14px;background:var(--hud-bg);border:1px solid var(--hud-borda);box-shadow:var(--sombra-2);font-size:.82em;max-width:min(360px,calc(100% - 24px))}
.chip-baixando .barra{width:90px;flex:none}
.giro{width:1.1em;height:1.1em;border-radius:50%;border:2.5px solid var(--borda-2);border-top-color:var(--aps-teal);animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}

/* Carregamento com porcentagem */
#carregando{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(243,246,248,.9);backdrop-filter:blur(3px)}
html[data-tema="escuro"] #carregando{background:rgba(11,20,33,.92)}
.carga-cartao{width:min(460px,100%);max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--card);border:1px solid var(--borda);border-radius:20px;box-shadow:var(--sombra);padding:1.35em 1.35em 1.15em}
.carga-topo{display:flex;align-items:center;gap:.8em;margin-bottom:1em}
.carga-topo .brasao{width:3.2em;height:3.2em}
.carga-topo .brasao-alt{width:3.2em;height:3.2em}
.carga-pct{margin-left:auto;font-weight:700;font-size:1.7em;font-variant-numeric:tabular-nums;color:var(--marca)}
.barra{height:10px;border-radius:999px;background:var(--card-3);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--marca-grad);transition:width .25s ease}
.carga-msg{margin:.7em 0 .2em;font-weight:600;min-height:1.4em}
.carga-sub{font-size:.85em;color:var(--tinta-3);min-height:1.2em}
.passos{list-style:none;margin:.9em 0 0;padding:0;display:flex;flex-direction:column;gap:.3em}
.passos li{display:flex;align-items:center;gap:.55em;font-size:.88em;color:var(--tinta-3)}
.passos li .marc{width:1.25em;height:1.25em;border-radius:50%;border:2px solid var(--borda-2);display:grid;place-items:center;flex:none}
.passos li.ativo{color:var(--tinta);font-weight:600}
.passos li.ativo .marc{border-color:var(--aps-teal);border-top-color:transparent;animation:gira .8s linear infinite}
.passos li.feito .marc{border-color:var(--ok);background:var(--ok);color:#fff}
.passos li.erro .marc{border-color:var(--erro);background:var(--erro);color:#fff}
.passos li.pulado{opacity:.55}
.passos .marc .ic{width:.8em;height:.8em;stroke-width:3}
.carga-acoes{display:flex;flex-wrap:wrap;gap:.5em;margin-top:1em}

/* ---------- Conteúdo dos painéis ---------- */
.secao{margin-bottom:1.25em}
.secao-cab{display:flex;align-items:center;gap:.5em;margin:.15em 0 .6em}
.secao-cab h3{margin:0;font-size:.8em;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--tinta-3);flex:1;min-width:0}
.secao-cab .cont{font-size:.8em;font-weight:700;color:var(--tinta-3);white-space:nowrap}
.cartao{background:var(--card);border:1px solid var(--borda);border-radius:var(--raio);box-shadow:var(--sombra-2)}
.nota{font-size:.84em;color:var(--tinta-3);line-height:1.45}
.nota b{color:var(--tinta-2)}
.camadas{display:flex;flex-direction:column;gap:.1em}
.camada{display:flex;align-items:center;gap:.6em;padding:.42em .5em;border-radius:10px;cursor:pointer;user-select:none}
.camada:hover{background:var(--card-3)}
.camada .ic-caixa{width:2.05em;height:2.05em;border-radius:9px;display:grid;place-items:center;background:var(--card-3);color:var(--tinta-2);flex:none}
.camada .nome{flex:1;font-weight:600;min-width:0}
.sw{position:relative;width:2.55em;height:1.5em;flex:none;display:inline-block}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--borda-2);transition:background .15s}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:calc(1.5em - 4px);height:calc(1.5em - 4px);border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked + i{background:var(--marca)}
.sw input:checked + i::after{transform:translateX(1.05em)}
.sw input:focus-visible + i{box-shadow:var(--foco)}
.chips{display:flex;flex-wrap:wrap;gap:.4em;margin-bottom:.65em}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.3em .75em;border-radius:999px;border:1.5px solid var(--borda-2);background:var(--card);font-size:.82em;font-weight:600;color:var(--tinta-2);white-space:nowrap}
.chip:hover{background:var(--card-3)}
.chip .c{font-weight:700;color:var(--tinta-3)}
.chip.ativo{border:2px dashed var(--c,var(--marca));color:var(--c,var(--marca));background:var(--card-2)}
.chip i.p{width:.62em;height:.62em;border-radius:50%;display:block}
.lista{display:flex;flex-direction:column;gap:.15em}
.item-lista{display:flex;align-items:flex-start;gap:.6em;width:100%;padding:.55em .55em;border-radius:12px;border:1.5px solid transparent;background:transparent;text-align:left}
.item-lista:hover{background:var(--card-3)}
.item-lista.sel{border-color:var(--cta);background:var(--cta-clara)}
.item-lista .dot{width:.8em;height:.8em;border-radius:50%;margin-top:.32em;flex:none}
.item-lista .corpo-item{flex:1;min-width:0}
.item-lista .tit{display:block;font-weight:700;line-height:1.25}
.item-lista .sub{display:block;font-size:.84em;color:var(--tinta-3);line-height:1.3;margin-top:.1em}
.item-lista .lado{flex:none;align-self:center}
.tag{display:inline-flex;align-items:center;gap:.3em;padding:.1em .5em;border-radius:999px;font-size:.7em;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1.5px solid currentColor;white-space:nowrap}
.tag.exata{color:var(--ok)}
.tag.aprox{color:var(--alerta);border-style:dashed}
.tag.sem{color:var(--tinta-3)}
.tag.local{color:var(--info);border-style:dashed}
.campo{width:100%;height:2.45em;border-radius:10px;border:1.5px solid var(--borda);background:var(--card-2);padding:0 .8em;outline:none}
.campo:focus{border-color:var(--aps-teal);box-shadow:var(--foco);background:var(--card)}
.esqueleto{border-radius:10px;background:linear-gradient(90deg,var(--card-3) 25%,var(--card-2) 37%,var(--card-3) 63%);background-size:400% 100%;animation:brilho 1.2s infinite linear;height:2.7em;margin-bottom:.45em}
@keyframes brilho{0%{background-position:100% 0}100%{background-position:0 0}}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:2.6em;padding:.35em 1em;border-radius:12px;border:1.5px solid var(--borda-2);background:var(--card);font-weight:700;color:var(--tinta);text-align:center;line-height:1.2}
.btn:hover{background:var(--card-3)}
a.btn{text-decoration:none;color:var(--tinta)}
a.btn.prim{color:#fff}
.btn.prim{background:var(--cta-grad);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(233,96,45,.25)}
.btn.prim:hover{filter:brightness(1.05)}
.btn.escuro{background:var(--navy);border-color:var(--navy);color:#fff}
html[data-tema="escuro"] .btn.escuro{background:#E8EEF6;border-color:#E8EEF6;color:#0F1D33}
.btn.marca{background:var(--marca-grad);border-color:transparent;color:#fff}
.btn.peq{min-height:2.2em;padding:.25em .75em;font-size:.86em;border-radius:10px}
.btn.bloco{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;filter:none}
.btns{display:flex;flex-wrap:wrap;gap:.45em}

/* Cartão de seleção */
.sel-vazia{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.6em;padding:1.6em .6em;color:var(--tinta-3)}
.sel-vazia .ic-g{width:2.6em;height:2.6em;color:var(--borda-2)}
.sel-cab{display:flex;align-items:flex-start;gap:.7em;margin-bottom:.8em}
.sel-cab .avatar{width:3em;height:3em;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none;font-weight:700}
.sel-cab .tit{flex:1;min-width:0}
.sel-cab h2{margin:.1em 0 .15em;font-size:1.18em;line-height:1.25}
.sel-img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:var(--card-3);border-radius:14px;margin-bottom:.8em}
.sel-img.falhou{display:none}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5em;margin-bottom:.8em}
.kv-item{position:relative;background:var(--card-2);border:1px solid var(--borda);border-radius:12px;padding:.5em 2.2em .55em .7em;min-width:0}
.kv-item .rot{display:flex;align-items:center;gap:.35em;font-size:.68em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3)}
.kv-item .val{font-weight:600;overflow-wrap:anywhere;line-height:1.3;margin-top:.1em}
.kv-item .copiar{position:absolute;top:.35em;right:.35em;width:1.9em;height:1.9em;border-radius:8px}
.aviso{display:flex;gap:.55em;align-items:flex-start;padding:.6em .7em;border-radius:12px;font-size:.86em;line-height:1.4;margin-bottom:.8em}
.aviso.alerta{background:var(--alerta-clara);color:var(--tinta)}
.aviso.alerta .ic{color:var(--alerta)}
.aviso.info{background:var(--info-clara);color:var(--tinta)}
.aviso.info .ic{color:var(--info)}
.aviso.ok{background:var(--ok-clara);color:var(--tinta)}
.aviso.ok .ic{color:var(--ok)}

/* Ajustes (equivalente às pastas do dat.gui, em português) */
.grupo{border:1px solid var(--borda);border-radius:14px;margin-bottom:.6em;background:var(--card);overflow:hidden}
.grupo > summary{list-style:none;display:flex;align-items:center;gap:.55em;padding:.65em .75em;font-weight:700;cursor:pointer;user-select:none}
.grupo > summary::-webkit-details-marker{display:none}
.grupo > summary .seta{margin-left:auto;transition:transform .15s;color:var(--tinta-3)}
.grupo[open] > summary .seta{transform:rotate(180deg)}
.grupo > summary .ic-caixa{width:1.9em;height:1.9em;border-radius:8px;display:grid;place-items:center;background:var(--marca-clara);color:var(--marca)}
.grupo .itens{padding:.1em .75em .6em}
.ajuste{display:grid;grid-template-columns:minmax(0,1fr) 4.9em;gap:.25em .6em;align-items:center;padding:.45em 0;border-top:1px dashed var(--borda)}
.ajuste:first-child{border-top:0}
.ajuste label{grid-column:1 / -1;font-weight:600;font-size:.9em;color:var(--tinta-2)}
.ajuste input[type=range]{width:100%;accent-color:var(--marca);margin:0}
.ajuste input[type=number],.ajuste input[type=text],.ajuste input[type=date],.ajuste select{width:100%;height:2.15em;border-radius:8px;border:1.5px solid var(--borda);background:var(--card-2);padding:0 .45em;font-weight:700;outline:none}
.ajuste input[type=number],.ajuste input[type=text]{text-align:right;font-variant-numeric:tabular-nums}
.ajuste.linha{grid-template-columns:minmax(0,1fr) auto}
.ajuste.linha label{grid-column:auto}
.ajuste.larga{grid-template-columns:1fr}
.ajuste input:focus,.ajuste select:focus{border-color:var(--aps-teal);box-shadow:var(--foco)}
.seg{display:inline-flex;border:1.5px solid var(--borda);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:.4em .75em;font-weight:700;font-size:.86em;color:var(--tinta-2);display:inline-flex;align-items:center;gap:.35em}
.seg button + button{border-left:1.5px solid var(--borda)}
.seg button.ativo{background:var(--marca-clara);color:var(--marca)}

/* Botões de topo e fim nas áreas roláveis */
.rolar-btns{position:absolute;right:.6em;bottom:.6em;z-index:4;display:flex;flex-direction:column;gap:.3em}
.rolar-btns button{width:2.2em;height:2.2em;border-radius:50%;border:1px solid var(--borda);background:var(--card);color:var(--tinta-2);box-shadow:var(--sombra-2);display:grid;place-items:center;padding:0;opacity:0;pointer-events:none;transition:opacity .15s}
.rolar-btns button.vis{opacity:.82;pointer-events:auto}
.rolar-btns button.vis:hover{opacity:1}

/* Scrim das gavetas */
#scrim{position:absolute;inset:0;z-index:30;background:rgba(15,29,51,.38);display:none}

/* Toasts e modais (fora do #app: repetem a fonte para acompanhar A-/A+) */
#toasts{position:fixed;right:16px;top:72px;z-index:120;display:flex;flex-direction:column;gap:.5em;align-items:flex-end;pointer-events:none;max-width:calc(100% - 32px);font-size:var(--fs);font-family:'Montserrat',system-ui,Arial,sans-serif}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:.6em;min-width:240px;max-width:430px;padding:.7em .75em .7em .8em;border-radius:14px;background:var(--card);color:var(--tinta);border:1px solid var(--borda);border-left:5px solid var(--c,var(--info));box-shadow:var(--sombra);animation:entra .2s ease}
.toast .ic{color:var(--c,var(--info));margin-top:.1em}
.toast .msg{flex:1;min-width:0;line-height:1.4}
.toast .msg b{display:block}
.toast .msg small{display:block;color:var(--tinta-3);font-size:.82em;margin-top:.15em}
.toast .fechar{border:0;background:transparent;color:var(--tinta-3);padding:0;width:1.6em;height:1.6em;display:grid;place-items:center;border-radius:6px}
.toast.sai{animation:sai .2s ease forwards}
@keyframes entra{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes sai{to{opacity:0;transform:translateY(-8px)}}
.modal-fundo{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:16px;background:rgba(15,29,51,.45);font-size:var(--fs);font-family:'Montserrat',system-ui,Arial,sans-serif;color:var(--tinta)}
.modal{width:min(470px,100%);max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--card);border-radius:20px;box-shadow:var(--sombra);border:1px solid var(--borda);padding:1.2em 1.25em 1.1em}
.modal.larga{width:min(820px,100%)}
.modal h2{margin:0 0 .4em;font-size:1.15em}
.modal p{margin:.3em 0 .8em;color:var(--tinta-2);line-height:1.5}
.modal .acoes{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:.5em;margin-top:1em}
.modal img.previa{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--borda)}

/* ---------- Responsividade ---------- */
@media (max-width:1024px){
  #corpo{grid-template-columns:var(--trilho-e) minmax(0,1fr) var(--trilho-d);transition:none}
  .painel{position:static}
  .painel .trilho{display:flex}
  .painel .painel-conteudo{display:none}
  #app.esq-off #painelEsq .painel-conteudo,#app.dir-off #painelDir .painel-conteudo{display:none}
  .redim{display:none}
  #app.gaveta-esq #painelEsq .painel-conteudo{display:flex;position:absolute;top:0;bottom:0;left:var(--trilho-e);width:min(360px,calc(100% - var(--trilho-e) - var(--trilho-d) - 20px));z-index:35;box-shadow:var(--sombra);border-right:1px solid var(--borda)}
  #app.gaveta-dir #painelDir .painel-conteudo{display:flex;position:absolute;top:0;bottom:0;right:var(--trilho-d);width:min(390px,calc(100% - var(--trilho-e) - var(--trilho-d) - 20px));z-index:35;box-shadow:var(--sombra);border-left:1px solid var(--borda)}
  #app.gaveta-esq #scrim,#app.gaveta-dir #scrim{display:block}
  #app.gaveta-esq #painelEsq,#app.gaveta-dir #painelDir{z-index:36}
  .estado-salvo{display:none}
}
@media (max-width:720px){
  #corpo{grid-template-columns:0 minmax(0,1fr) 0}
  .painel{border:0 !important}
  .painel .trilho{display:none !important}
  #app.gaveta-esq #painelEsq .painel-conteudo{left:0;width:min(400px,calc(100% - 28px))}
  #app.gaveta-dir #painelDir .painel-conteudo{right:0;width:min(420px,calc(100% - 28px))}
  #topo{gap:.4em;padding:.45em .55em}
  .marca-txt,.grupo-zoom,.chip-fonte span:not(.ponto),.busca kbd{display:none}
  .chip-fonte{padding:0;width:2.35em;justify-content:center}
  .busca{flex:1 1 auto}
  .hora-rapida{left:12px;right:auto;bottom:12px;transform:none;max-width:calc(100% - 24px)}
  .hora-rapida input[type=range]{width:min(170px,32vw)}
  .hud-id{bottom:64px}
  .hud-ie .legenda{display:none}
  .banner{top:8px;left:8px;right:8px;transform:none;max-width:none;font-size:.8em}
  .banner .det{display:none}
  .chip-baixando{top:auto;bottom:64px;right:12px;left:12px;max-width:none}
}
@media (max-width:420px){
  .hora-rapida .btn-ic{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>

  <div class="faixa-aps" aria-hidden="true"></div>

  <div id="corpo">

          <button type="button" data-rolar="fim" title="Ir para o fim" aria-label="Ir para o fim"><svg class="ic"><use href="#i-seta-b"/></svg></button>
        </div>
      </div>
      <div class="redim" id="redimEsq" title="Arraste para redimensionar. Duplo clique restaura a largura."></div>

function ic(nome, classe) {
  return '<svg class="ic' + (classe ? ' ' + classe : '') + '" aria-hidden="true"><use href="#i-' + nome + '"/></svg>';
}
function esc(v) {
  return String(v === undefined || v === null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function arred(v, casas) { const f = Math.pow(10, casas || 0); return Math.round(v * f) / f; }

/* Sorteio determinístico (mulberry32 do original, com o mesmo cuidado de módulo 2^32). */
function mulberry32(semente) {
  let a = semente >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) % 0x100000000;

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  return (h >>> 0) / 4294967296;

  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, semente), b = hash2(ix + 1, iy, semente);
  const c = hash2(ix, iy + 1, semente), d = hash2(ix + 1, iy + 1, semente);

/* Texto sem acento, minúsculo, só letras, números, espaço e + (para busca e casamento de nomes). */
function normalizar(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[^a-z0-9+]+/g, ' ').trim();
}

}

const FMT_NUM = new Intl.NumberFormat('pt-BR');
const FMT_NUM1 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const FMT_COORD = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 6, maximumFractionDigits: 6 });
function fmtNum(n) { return FMT_NUM.format(Math.round(n)); }
function fmtHora(h) {
  let tot = Math.round(((h % 24) + 24) % 24 * 60);
  if (tot >= 1440) tot = 0;
  return String(Math.floor(tot / 60)).padStart(2, '0') + ':' + String(tot % 60).padStart(2, '0');
}
function fmtDataHora(d) {
  if (!d) return '';
  const x = (d instanceof Date) ? d : new Date(d);
  if (isNaN(x.getTime())) return '';
  return x.toLocaleDateString('pt-BR') + ' ' + x.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function fmtHoraCurta(d) {
  const x = (d instanceof Date) ? d : new Date(d);
  return x.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function fmtMetros(m) { return m >= 1000 ? FMT_NUM1.format(m / 1000) + ' km' : fmtNum(m) + ' m'; }
function fmtArea(m2) { return m2 >= 1e6 ? FMT_NUM1.format(m2 / 1e6) + ' km²' : fmtNum(m2) + ' m²'; }
function fmtBytes(b) { return b >= 1048576 ? FMT_NUM1.format(b / 1048576) + ' MB' : fmtNum(b / 1024) + ' KB'; }
function fmtCoord(v) { return FMT_COORD.format(v); }
function hojeISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function carimboArquivo() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') +
    '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
}

function debounce(fn, ms) {
  let t = 0;
  return function () { const a = arguments, s = this; clearTimeout(t); t = setTimeout(() => fn.apply(s, a), ms); };
}
function proximoQuadro() { return new Promise(r => requestAnimationFrame(() => r())); }
function comTempo(promessa, ms, msg) {
  let t;
  return Promise.race([
    promessa,
    new Promise((_, rej) => { t = setTimeout(() => rej(new Error(msg || 'Tempo esgotado')), ms); })
  ]).finally(() => clearTimeout(t));
}

function lerLocal(chave, padrao) {

const banco = {
  _db: null,
  abrir() {
    if (this._db) return Promise.resolve(this._db);
    return comTempo(new Promise((res, rej) => {
      if (!('indexedDB' in window)) { rej(new Error('IndexedDB indisponível')); return; }
      const req = indexedDB.open(IDB_NOME, 1);
      req.onupgradeneeded = () => { try { req.result.createObjectStore(IDB_LOJA); } catch (e) { /* já existe */ } };
      req.onsuccess = () => { this._db = req.result; res(req.result); };
      req.onerror = () => rej(req.error || new Error('Falha ao abrir IndexedDB'));
      req.onblocked = () => rej(new Error('IndexedDB bloqueado'));
    }), 4000, 'IndexedDB não respondeu');
  },
  async ler(chave) {
    const db = await this.abrir();
    return comTempo(new Promise((res, rej) => {
      const q = db.transaction(IDB_LOJA, 'readonly').objectStore(IDB_LOJA).get(chave);
      q.onsuccess = () => res(q.result === undefined ? null : q.result);
      q.onerror = () => rej(q.error);
    }), 8000, 'Leitura do cache demorou demais');
  },
  async gravar(chave, valor) {
    const db = await this.abrir();
    return comTempo(new Promise((res, rej) => {
      const tx = db.transaction(IDB_LOJA, 'readwrite');
      tx.objectStore(IDB_LOJA).put(valor, chave);
      tx.oncomplete = () => res(true);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('Gravação cancelada'));
    }), 15000, 'Gravação do cache demorou demais');
  },
  async apagar(chave) {
    const db = await this.abrir();
    return new Promise((res, rej) => {
      const tx = db.transaction(IDB_LOJA, 'readwrite');
      tx.objectStore(IDB_LOJA).delete(chave);
      tx.oncomplete = () => res(true);
      tx.onerror = () => rej(tx.error);
    });
  }
};

/* ---------- Modais (cartão com max-height:100%, rolagem própria) ---------- */
function abrirModal(html, opcoes) {
  const o = opcoes || {};
  const fundo = document.createElement('div');
  fundo.className = 'modal-fundo';
  fundo.innerHTML = '<div class="modal' + (o.larga ? ' larga' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  $('#modalRaiz').appendChild(fundo);
  const fechar = (valor) => {
    if (!fundo.isConnected) return;
    fundo.remove();
    document.removeEventListener('keydown', teclas, true);
    if (o.aoFechar) o.aoFechar(valor);
  };
  const teclas = (ev) => { if (ev.key === 'Escape') { ev.stopPropagation(); fechar(null); } };
  document.addEventListener('keydown', teclas, true);
  fundo.addEventListener('mousedown', (ev) => { if (ev.target === fundo) fechar(null); });
  const primeiro = fundo.querySelector('[autofocus], input, button.prim, button');
  if (primeiro) setTimeout(() => focar(primeiro), 30);
  return { el: fundo, fechar };
}

    else throw new Error('sem clipboard');

/* ---------- Ponte com o Apps Script (google.script.run em Promise) ---------- */
function temGAS() {
  try { return typeof google !== 'undefined' && !!(google.script && google.script.run); } catch (e) { return false; }
}
function gs(nomeFuncao) {
  const args = Array.prototype.slice.call(arguments, 1);
  return comTempo(new Promise((res, rej) => {
    if (!temGAS()) { rej(new Error('Apps Script indisponível neste modo')); return; }
    const exec = google.script.run
      .withSuccessHandler((r) => {
        if (r && r.ok === false) rej(new Error(r.erro || 'O servidor recusou a operação'));
        else res(r);
      })
      .withFailureHandler((e) => rej(e instanceof Error ? e : new Error(String((e && e.message) || e))));
    if (typeof exec[nomeFuncao] !== 'function') { rej(new Error('Função do servidor não encontrada: ' + nomeFuncao)); return; }
    exec[nomeFuncao].apply(exec, args);
  }), 330000, 'O servidor não respondeu a tempo');
}

  return new Promise((res) => {

/* ---------- Carregar scripts com reserva (CDN principal e alternativa) ---------- */
function carregarScript(urls, pronto, msTimeout) {
  return new Promise((resolve, reject) => {
    if (pronto()) { resolve('já carregado'); return; }
    let i = 0;
    const tentar = () => {
      if (i >= urls.length) { reject(new Error('Não foi possível carregar ' + urls[0].split('/').pop() + ' de nenhuma CDN.')); return; }
      const url = urls[i++];
      const s = document.createElement('script');
      let feito = false;
      const t = setTimeout(() => { if (!feito) { feito = true; s.remove(); tentar(); } }, msTimeout || 20000);
      s.src = url; s.async = true; s.crossOrigin = 'anonymous';
      s.onload = () => { if (feito) return; feito = true; clearTimeout(t); if (pronto()) resolve(url); else { s.remove(); tentar(); } };
      s.onerror = () => { if (feito) return; feito = true; clearTimeout(t); s.remove(); tentar(); };
      document.head.appendChild(s);
    };
    tentar();
  });
}

/* ---------- Rolagem contida (página embutida no Google Sites / HtmlService) ---------- */
function rolavel(el, eixo) {
  const cs = getComputedStyle(el);
  const ov = eixo === 'x' ? cs.overflowX : cs.overflowY;
  if (ov !== 'auto' && ov !== 'scroll') return false;
  return eixo === 'x' ? el.scrollWidth > el.clientWidth + 1 : el.scrollHeight > el.clientHeight + 1;
}
function contedorRolagem(alvo, dy, dx) {
  let el = alvo && alvo.nodeType === 1 ? alvo : (alvo && alvo.parentElement);
  while (el && el !== document.body && el !== document.documentElement) {
    if (dy !== undefined && dy !== 0 && rolavel(el, 'y')) {
      if (dy < 0 ? el.scrollTop > 0 : el.scrollTop + el.clientHeight < el.scrollHeight - 1) return el;
    }
    if (dx !== undefined && dx !== 0 && rolavel(el, 'x')) {
      if (dx < 0 ? el.scrollLeft > 0 : el.scrollLeft + el.clientWidth < el.scrollWidth - 1) return el;
    }
    if (dy === undefined && dx === undefined && (rolavel(el, 'y') || rolavel(el, 'x'))) return el;
    el = el.parentElement;
  }
  return null;
}
function rolarPara(el, bloco) {
  if (!el) return;
  const cont = contedorRolagem(el);
  if (!cont) return;
  const rc = cont.getBoundingClientRect(), re = el.getBoundingClientRect();
  const escala = rc.height / (cont.clientHeight || rc.height || 1) || 1;
  const margem = parseFloat(getComputedStyle(el).scrollMarginTop) || 8;
  const topoRel = (re.top - rc.top) / escala + cont.scrollTop;
  let destino;
  if (bloco === 'center') destino = topoRel - (cont.clientHeight - re.height / escala) / 2;
  else if (bloco === 'nearest') {
    if (re.top - rc.top < 0) destino = topoRel - margem;
    else if (re.bottom > rc.bottom) destino = topoRel + re.height / escala - cont.clientHeight + margem;
    else return;
  } else destino = topoRel - margem;
  cont.scrollTo({ top: Math.max(0, destino), behavior: 'smooth' });
}
function focar(el) {
  if (!el) return;
  try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  rolarPara(el, 'nearest');
}
function editavel(el) {
  if (!el) return false;
  const t = el.tagName;
  return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || el.isContentEditable;
}
function ligarGuardasRolagem() {
  if (!document.documentElement.classList.contains('embutido')) return;
  document.addEventListener('wheel', (ev) => {
    if (ev.ctrlKey) return;
    if (!contedorRolagem(ev.target, ev.deltaY, ev.deltaX)) ev.preventDefault();
  }, { passive: false });
  let toqueY = 0, toqueX = 0;
  document.addEventListener('touchstart', (ev) => {
    if (ev.touches && ev.touches[0]) { toqueY = ev.touches[0].clientY; toqueX = ev.touches[0].clientX; }
  }, { passive: true });
  document.addEventListener('touchmove', (ev) => {
    if (!ev.cancelable || !ev.touches || !ev.touches[0]) return;
    const dy = toqueY - ev.touches[0].clientY, dx = toqueX - ev.touches[0].clientX;
    if (!contedorRolagem(ev.target, dy, dx)) ev.preventDefault();
  }, { passive: false });
  document.addEventListener('keydown', (ev) => {
    const teclas = { ' ': 1, PageUp: 1, PageDown: 1, ArrowUp: 1, ArrowDown: 1, Home: 1, End: 1 };
    if (!teclas[ev.key] || ev.defaultPrevented) return;
    const alvo = document.activeElement;
    if (editavel(alvo)) return;
    if (ev.key === ' ' && alvo && (alvo.tagName === 'BUTTON' || alvo.tagName === 'A')) return;
    if (alvo && alvo.closest && alvo.closest('#palco')) return; /* o mapa trata as setas */
    const passo = { ' ': 0.85, PageDown: 0.85, PageUp: -0.85, ArrowDown: 0.12, ArrowUp: -0.12 };
    const cont = contedorRolagem(alvo && alvo !== document.body ? alvo : $('#rolagemDir')) ||
      $('.modal') || $('#rolagemDir');
    if (cont && cont.scrollHeight > cont.clientHeight) {
      if (ev.key === 'Home') cont.scrollTop = 0;
      else if (ev.key === 'End') cont.scrollTop = cont.scrollHeight;
      else cont.scrollTop += (passo[ev.key] || 0) * cont.clientHeight * (ev.key === ' ' && ev.shiftKey ? -1 : 1);
    }
    ev.preventDefault();
  });
}

/* ---------- Tela de carregamento com porcentagem ---------- */
const carga = {
  passos: [],
  pesoTotal: 0,
  iniciar(passos) {
    this.passos = passos.map(p => Object.assign({ estado: 'pendente', parcial: 0 }, p));
    this.pesoTotal = this.passos.reduce((s, p) => s + p.peso, 0);
    $('#carregando').hidden = false;
    $('#cargaAcoes').hidden = true;
    $('#cargaAcoes').innerHTML = '';
    this.desenhar();
    this.atualizarPct();
  },
  desenhar() {
    const marc = { feito: ic('ok'), erro: ic('fechar') };
    $('#cargaPassos').innerHTML = this.passos.map(p =>
      '<li class="' + p.estado + '"><span class="marc">' + (marc[p.estado] || '') + '</span><span>' + esc(p.rotulo) + '</span></li>').join('');
  },
  passo(id, msg, sub) {
    this.passos.forEach(p => {
      if (p.id === id) { p.estado = 'ativo'; p.parcial = 0; }
      else if (p.estado === 'ativo') { p.estado = 'feito'; p.parcial = 1; }
    });
    $('#cargaMsg').textContent = msg || '';
    $('#cargaSub').textContent = sub || '';
    this.desenhar();
    this.atualizarPct();
  },
  progresso(frac, sub) {
    const p = this.passos.find(x => x.estado === 'ativo');
    if (p) p.parcial = clamp(frac, 0, 1);
    if (sub !== undefined) $('#cargaSub').textContent = sub;
    this.atualizarPct();
  },
  pular(id) {
    const p = this.passos.find(x => x.id === id);
    if (p && p.estado !== 'feito') { p.estado = 'pulado'; p.parcial = 1; }
    this.desenhar(); this.atualizarPct();
  },
  atualizarPct() {
    let acc = 0;
    this.passos.forEach(p => { acc += p.peso * (p.estado === 'feito' || p.estado === 'pulado' ? 1 : (p.estado === 'ativo' ? p.parcial : 0)); });
    const pct = this.pesoTotal ? Math.round(acc / this.pesoTotal * 100) : 0;
    $('#cargaPct').textContent = pct + '%';
    $('#cargaBarra').style.width = pct + '%';
  },
  concluir() {
    this.passos.forEach(p => { if (p.estado === 'ativo' || p.estado === 'pendente') p.estado = 'feito'; p.parcial = 1; });
    this.desenhar(); this.atualizarPct();
    setTimeout(() => { $('#carregando').hidden = true; }, 250);
  },
  erro(msg, detalhe, acoes) {
    this.passos.forEach(p => { if (p.estado === 'ativo') p.estado = 'erro'; });
    this.desenhar();
    $('#carregando').hidden = false;
    $('#cargaMsg').textContent = msg;
    $('#cargaSub').textContent = detalhe || '';
    const caixa = $('#cargaAcoes');
    caixa.innerHTML = '';
    (acoes || []).forEach(a => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn ' + (a.classe || '');
      b.innerHTML = (a.icone ? ic(a.icone) : '') + '<span>' + esc(a.rotulo) + '</span>';
      b.addEventListener('click', a.acao);
      caixa.appendChild(b);
    });
    caixa.hidden = !(acoes && acoes.length);
  }
};

/* =====================================================================
   GEOMETRIA, PROJEÇÃO E BAIRROS
   ===================================================================== */
const PHI0 = ORIGEM.lat * Math.PI / 180;
const M_POR_GRAU_LAT = 111132.92 - 559.82 * Math.cos(2 * PHI0) + 1.175 * Math.cos(4 * PHI0);
const M_POR_GRAU_LON = 111412.84 * Math.cos(PHI0) - 93.5 * Math.cos(3 * PHI0) + 0.118 * Math.cos(5 * PHI0);
function paraXZ(lon, lat) { return [(lon - ORIGEM.lon) * M_POR_GRAU_LON, (ORIGEM.lat - lat) * M_POR_GRAU_LAT]; }
function paraLonLat(x, z) { return [ORIGEM.lon + x / M_POR_GRAU_LON, ORIGEM.lat - z / M_POR_GRAU_LAT]; }

/* Polígonos em vetor plano [x0, z0, x1, z1, ...] (sem repetir o primeiro vértice no fim). */
function areaAssinada(p) {
  let a = 0;
  const n = p.length >> 1;
  for (let i = 0, j = n - 1; i < n; j = i++) a += p[2 * j] * p[2 * i + 1] - p[2 * i] * p[2 * j + 1];
  return a / 2;
}
function centroide(p) {

  const n = p.length >> 1;

    const x0 = p[2 * j], z0 = p[2 * j + 1], x1 = p[2 * i], z1 = p[2 * i + 1];
    const c = x0 * z1 - x1 * z0;
    a += c; cx += (x0 + x1) * c; cz += (z0 + z1) * c;
  }
  if (Math.abs(a) < 1e-9) {
    let sx = 0, sz = 0;
    for (let k = 0; k < n; k++) { sx += p[2 * k]; sz += p[2 * k + 1]; }
    return [sx / Math.max(1, n), sz / Math.max(1, n)];
  }
  a *= 0.5;
  return [cx / (6 * a), cz / (6 * a)];
}
function dentro(x, z, p) {
  let d = false;
  const n = p.length >> 1;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const xi = p[2 * i], zi = p[2 * i + 1], xj = p[2 * j], zj = p[2 * j + 1];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) d = !d;
  }

}
function dist2Seg(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az;
  const l2 = dx * dx + dz * dz;
  let t = l2 > 0 ? ((px - ax) * dx + (pz - az) * dz) / l2 : 0;
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  const qx = ax + t * dx - px, qz = az + t * dz - pz;
  return qx * qx + qz * qz;
}
function distBorda(x, z, p) {
  let m = Infinity;

  for (let i = 0, j = n - 1; i < n; j = i++) {
    const d = dist2Seg(x, z, p[2 * j], p[2 * j + 1], p[2 * i], p[2 * i + 1]);
    if (d < m) m = d;
  }

}
function caixa(p) {
  let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
  for (let i = 0; i < p.length; i += 2) {
    const x = p[i], z = p[i + 1];
    if (x < a) a = x; if (z < b) b = z; if (x > c) c = x; if (z > d) d = z;
  }
  return { minX: a, minZ: b, maxX: c, maxZ: d };
}
function fechado(p, tol) {
  const n = p.length;
  return n >= 8 && Math.abs(p[0] - p[n - 2]) <= (tol || 0.05) && Math.abs(p[1] - p[n - 1]) <= (tol || 0.05);
}
function abrirAnel(p) { return fechado(p, 0.05) ? p.slice(0, p.length - 2) : p; }

/* Ponto interno mais afastado da borda (aproximação de polo de inacessibilidade). */
function poloInterno(p, bb) {
  let melhor = null, melhorD = -1;
  const N = 18;
  let x0 = bb.minX, z0 = bb.minZ, w = bb.maxX - bb.minX, h = bb.maxZ - bb.minZ;
  for (let rodada = 0; rodada < 3; rodada++) {
    for (let i = 0; i <= N; i++) {
      for (let j = 0; j <= N; j++) {
        const x = x0 + w * i / N, z = z0 + h * j / N;
        if (!dentro(x, z, p)) continue;
        const d = distBorda(x, z, p);
        if (d > melhorD) { melhorD = d; melhor = [x, z]; }
      }
    }
    if (!melhor) break;
    w = w * 3 / N; h = h * 3 / N;
    x0 = melhor[0] - w / 2; z0 = melhor[1] - h / 2;
  }
  return melhor || centroide(p);
}

/* Casco convexo (cadeia monótona) e retângulo de área mínima (calibres giratórios). */
function cascoConvexo(p) {
  const pts = [];

/* Converte os elementos (Overpass bruto ou compacto) no modelo da cidade em metros. */
function processarOSM(dados) {
  const els = elementosDe(dados);
  const m = { ruas: [], predios: [], areas: [], rios: [], trilhos: [], lugares: [], pois: [], centro: null,
    geradoEm: dados.geradoEm || null, contagem: {} };
  for (const e of els) {
    const tg = e.tg || {};
    try {
      if (e.t === 'n') {
        if (!e.c) continue;
        const xz = paraXZ(e.c[0], e.c[1]);
        if (tg.place) {
          m.lugares.push({ nome: tg.name || '', tipo: tg.place, x: xz[0], z: xz[1] });
          if ((tg.place === 'city' || tg.place === 'town') && normalizar(tg.name).indexOf('cruz alta') >= 0) m.centro = xz;
        }
        if (ehPOI(tg)) m.pois.push(criarPOI(e, tg, xz[0], xz[1]));
        continue;
      }
      if (e.t === 'w') {
        if (!e.g || e.g.length < 4) continue;
        const p = planoParaXZ(e.g);
        const anel = fechado(p, 0.5);
        if (tg.highway && VIAS[tg.highway] && tg.area !== 'yes') {
          m.ruas.push({ cls: tg.highway, nome: tg.name || '', p, l: larguraVia(tg), piso: pisoVia(tg), ponte: tg.bridge === 'yes' || tg.bridge === 'viaduct' });
        } else if (tg.highway === 'pedestrian' && tg.area === 'yes' && anel) {
          m.areas.push({ k: 'praca', p: abrirAnel(p), nome: tg.name || '' });
        }
        if (tg.building && tg.building !== 'no' && anel) {
          const pa = abrirAnel(p);
          if (pa.length >= 6) m.predios.push({ id: e.id, tipoOsm: 'way', p: pa, tg });
        } else if (tg.waterway) {
          m.rios.push({ p, l: tg.waterway === 'river' ? 14 : (tg.waterway === 'canal' ? 8 : (tg.waterway === 'stream' ? 4 : 2.5)), nome: tg.name || '' });
        } else if (tg.railway) {
          m.trilhos.push({ p, ativo: tg.railway === 'rail' || tg.railway === 'narrow_gauge' || tg.railway === 'light_rail' });
        } else if (anel && !tg.highway) {
          const k = tipoArea(tg);
          if (k) m.areas.push({ k, p: abrirAnel(p), nome: tg.name || '' });
        }
        if (ehPOI(tg)) {
          const c = anel ? centroide(abrirAnel(p)) : [p[0], p[1]];
          m.pois.push(criarPOI(e, tg, c[0], c[1]));
        }
        continue;
      }
      if (e.t === 'r' && Array.isArray(e.m)) {
        const externos = e.m.filter(x => x.r === 'outer' || x.r === '').map(x => planoParaXZ(x.g));
        const aneis = montarAneis(externos);
        if (tg.building && tg.building !== 'no') {
          for (const a of aneis) m.predios.push({ id: e.id, tipoOsm: 'relation', p: a, tg });
        } else {
          const k = tipoArea(tg);
          if (k) for (const a of aneis) m.areas.push({ k, p: a, nome: tg.name || '' });
        }
        if (ehPOI(tg) && aneis.length) { const c = centroide(aneis[0]); m.pois.push(criarPOI(e, tg, c[0], c[1])); }
      }
    } catch (erro) {
      console.warn('[Cruz Alta 3D] Elemento ignorado', e && e.id, erro);
    }
  }
  m.contagem = { ruas: m.ruas.length, predios: m.predios.length, areas: m.areas.length, pois: m.pois.length,
    lugares: m.lugares.length, rios: m.rios.length, trilhos: m.trilhos.length };
  return m;
}

    const ehUnidade = (am && am !== 'pharmacy' && am !== 'hospital' && AMENIDADES_SAUDE[am]) || (hc && hc !== 'pharmacy' && hc !== 'hospital');

/* Caixas instanciadas: matriz 4x4 + cor (linear) em arrays tipados que crescem. */
class Caixas {
  constructor(cap) {
    this.n = 0; this.cap = cap || 1024;
    this.m = new Float32Array(this.cap * 16);
    this.c = new Float32Array(this.cap * 3);
  }
  garantir(k) {
    if (this.n + k <= this.cap) return;
    let nc = this.cap * 2;
    while (nc < this.n + k) nc *= 2;
    this.redimensionar(nc);
  }
  redimensionar(nc) {
    const m = new Float32Array(nc * 16); m.set(this.m.subarray(0, this.n * 16));
    const c = new Float32Array(nc * 3); c.set(this.c.subarray(0, this.n * 3));
    this.m = m; this.c = c; this.cap = nc;
  }
  /* Base em y; (su, sv) medidos nos eixos locais u e v; rotY = -ângulo do eixo u. */
  add(x, y, z, su, sy, sv, rotY, cor) {
    this.garantir(1);
    const i = this.n++, o = i * 16;
    const cs = Math.cos(rotY), sn = Math.sin(rotY), m = this.m;
    m[o] = cs * su; m[o + 1] = 0; m[o + 2] = -sn * su; m[o + 3] = 0;
    m[o + 4] = 0; m[o + 5] = sy; m[o + 6] = 0; m[o + 7] = 0;
    m[o + 8] = sn * sv; m[o + 9] = 0; m[o + 10] = cs * sv; m[o + 11] = 0;
    m[o + 12] = x; m[o + 13] = y + sy / 2; m[o + 14] = z; m[o + 15] = 1;
    const q = i * 3;
    this.c[q] = cor.r; this.c[q + 1] = cor.g; this.c[q + 2] = cor.b;
    return i;
  }
}

  constructor(cap) { super(cap); this.sorteio = new Float32Array(this.cap); this.brilho = new Float32Array(this.cap); }
  redimensionar(nc) {
    const n = this.n;
    super.redimensionar(nc);

    const b = new Float32Array(nc); b.set(this.brilho.subarray(0, n));

/* ---------- Fatiador: devolve o controle ao navegador para não travar a tela ---------- */
function criarFatiador(aoProgresso) {
  let ultimo = performance.now();
  return {
    async talvez(frac, msg) {
      const agora = performance.now();
      if (agora - ultimo > 14) {
        if (aoProgresso) aoProgresso(frac, msg);
        await new Promise(r => setTimeout(r, 0));
        ultimo = performance.now();
      }
    },
    async agora(frac, msg) {
      if (aoProgresso) aoProgresso(frac, msg);
      await new Promise(r => setTimeout(r, 0));
      ultimo = performance.now();
    }
  };
}

/* ---------- Traçado ilustrativo (sem OSM): malha alinhada a cada bairro real ---------- */
function urbanizacao(x, z, ctx) {
  const d = Math.hypot(x - ctx.centro[0], z - ctx.centro[1]);
  const n = ruido2(x / 700, z / 700, ctx.semente ^ 0x777) - 0.5;
  return 1 - smoothstep(ctx.raioUrbano * 0.55, ctx.raioUrbano * 1.18, d + n * 1000);

function criarRuaIlustrativa(x0, z0, x1, z1, cls, cfg, r, ctx) {
  const dist = Math.hypot((x0 + x1) / 2 - ctx.centro[0], (z0 + z1) / 2 - ctx.centro[1]);
  const terra = cls === 'residential' && r() < smoothstep(1500, 4200, dist) * 0.8;
  const l = cls === 'secondary' ? cfg.larguraRua * 1.45 : (cls === 'tertiary' ? cfg.larguraRua * 1.15 : cfg.larguraRua);
  const piso = terra ? 'terra' : (cls === 'residential' && r() < 0.28 ? 'calcamento' : 'asfalto');

  /* Mantém apenas os trechos em área urbanizada (amostras a cada 25 m). */
  const passo = 25;
  const n = Math.max(1, Math.ceil((t1 - t0) / passo));
  let ini = null;
  for (let k = 0; k <= n; k++) {
    const ultimo = k === n;
    const tt = ultimo ? t1 : t0 + k * passo;
    const ok = urbanizacao(ox + dx * tt, oz + dz * tt, ctx) > 0.32;
    if (ok && ini === null) ini = tt;
    if ((!ok || ultimo) && ini !== null) {
      const fim = ok ? tt : Math.max(ini, tt - passo * 0.5);
      if (fim - ini >= 40) ruas.push(criarRuaIlustrativa(ox + dx * ini, oz + dz * ini, ox + dx * fim, oz + dz * fim, cls, cfg, r, ctx));
      ini = null;

function gerarRuasIlustrativas(bairros, cfg, ctx) {
  const r = mulberry32(cfg.semente ^ 0x1234567);

  const angGlobal = anguloModulo90(centro.obb.ang);

    let ang = anguloModulo90(b.obb.ang);
    if (difAngular90(ang, angGlobal) < 0.26) ang = angGlobal;
    ang += (r() - 0.5) * cfg.caosMalha * 0.18;

    const qU = cfg.quadra * (ehCentro ? 1 : 0.9 + r() * 0.45);

    }

        adicionarTrechosUrbanos(ruas, ox, oz, dx, dz, iv[0], iv[1], cls, cfg, r, ctx);
      }
    }
    k = 0;
    for (let u = Math.floor((minU - offU) / qU) * qU + offU; u <= maxU; u += qU, k++) {
      const uj = u + (r() - 0.5) * cfg.caosMalha * 0.25 * qU;
      const a2 = ang + (r() - 0.5) * cfg.caosMalha * 0.05;
      const dx = -Math.sin(a2), dz = Math.cos(a2);
      const ox = uj * c, oz = uj * s;
      for (const iv of recortarReta(ox, oz, dx, dz, b.p)) {
        if (iv[1] - iv[0] < 25) continue;
        const cls = (k % 5 === 0 && iv[1] - iv[0] > 350) ? 'secondary' : 'residential';
        adicionarTrechosUrbanos(ruas, ox, oz, dx, dz, iv[0], iv[1], cls, cfg, r, ctx);
      }
    }
  }
  /* Divisas compartilhadas entre bairros viram avenidas (quando em área urbanizada). */
  const arestas = new Map();
  const chave = (x0, z0, x1, z1) => {
    const a = Math.round(x0) + ',' + Math.round(z0), bq = Math.round(x1) + ',' + Math.round(z1);
    return a < bq ? a + '|' + bq : bq + '|' + a;
  };
  for (const b of bairros) {
    const n = b.p.length >> 1;
    for (let i = 0, j = n - 1; i < n; j = i++) {
      const x0 = b.p[2 * j], z0 = b.p[2 * j + 1], x1 = b.p[2 * i], z1 = b.p[2 * i + 1];
      const kk = chave(x0, z0, x1, z1);
      const e = arestas.get(kk);
      if (e) e.n++; else arestas.set(kk, { n: 1, x0, z0, x1, z1 });
    }
  }
  for (const e of arestas.values()) {
    if (e.n < 2) continue;
    const L = Math.hypot(e.x1 - e.x0, e.z1 - e.z0);
    if (L < 5) continue;
    if (urbanizacao((e.x0 + e.x1) / 2, (e.z0 + e.z1) / 2, ctx) < 0.32) continue;
    ruas.push(criarRuaIlustrativa(e.x0, e.z0, e.x1, e.z1, 'tertiary', cfg, r, ctx));
  }
  return ruas;
}

/* ---------- Classificação e altura dos prédios ---------- */

  if (am === 'clinic' || am === 'doctors' || am === 'health_post' || tg.healthcare) return 'saude';
  if (am === 'school' || am === 'university' || am === 'college' || am === 'kindergarten' ||
      b === 'school' || b === 'university' || b === 'college' || b === 'kindergarten') return 'escola';
  if (b === 'industrial' || b === 'warehouse' || b === 'factory' || b === 'silo' || b === 'storage_tank' || b === 'hangar' || b === 'farm_auxiliary' || b === 'barn') return 'industria';
  if (b === 'garage' || b === 'garages' || b === 'carport' || b === 'shed' || b === 'roof') return 'garagem';
  if (b === 'apartments' || b === 'dormitory' || b === 'hotel') return 'apartamentos';
  if (b === 'house' || b === 'detached' || b === 'semidetached_house' || b === 'terrace' || b === 'bungalow' || b === 'residential' || b === 'hut' || b === 'cabin') return area > 450 ? 'apartamentos' : 'casa';
  if (b === 'commercial' || b === 'retail' || b === 'office' || b === 'supermarket' || b === 'kiosk' || b === 'civic' || b === 'public' || b === 'government') return 'comercial';

}
const ROTULO_TIPO_PREDIO = { igreja: 'Igreja ou templo', hospital: 'Hospital', saude: 'Unidade de saúde', escola: 'Escola', industria: 'Galpão ou indústria',
  garagem: 'Garagem ou anexo', apartamentos: 'Edifício residencial', casa: 'Casa', comercial: 'Comércio ou serviço', generico: 'Edificação', residencial: 'Residencial' };

function zonaEm(x, z, cls, ctx) {
  const cfg = ctx.cfg;
  const d = Math.hypot(x - ctx.centro[0], z - ctx.centro[1]);
  const nucleo = 1 - smoothstep(cfg.raioCentro * 0.35, cfg.raioCentro * 1.5, d);
  const principal = (cls === 'primary' || cls === 'secondary' || cls === 'trunk' || cls === 'tertiary') ? 1 : 0;
  const com = ruido2(x / 420 + 3.1, z / 420 + 7.7, ctx.semente ^ 0x9e3779b9) * cfg.densidadeComercial + nucleo * 0.7 + principal * 0.12;
  const res = ruido2(x / 420 + 71.3, z / 420 + 19.7, ctx.semente ^ 0x51ab7c11) * cfg.densidadeResidencial + 0.18;
  return { d, nucleo, comercial: com >= res };
}
function andaresPorZona(x, z, zona, r, ctx) {
  const cfg = ctx.cfg, pd = cfg.peDireito;
  const escalaRes = Math.max(cfg.alturaResidencialMin, cfg.alturaMax * cfg.fatorResidencial);
  const escala = zona.comercial ? lerp(escalaRes * 1.5, cfg.alturaMax, zona.nucleo) : lerp(escalaRes, cfg.alturaMax * 0.5, zona.nucleo);
  const base = 0.35 + 0.65 * ruido2(x / 220, z / 220, ctx.semente ^ 0x3c6ef372);
  let h = Math.max(cfg.alturaMin, Math.pow(lerp(base, r(), cfg.variacaoAltura), 2.6) * escala);
  if (zona.nucleo < 0.4 && r() < 0.01 * cfg.densidadeComercial) h = Math.max(h, (4 + Math.floor(r() * 6)) * pd);
  return Math.max(1, Math.round(h / pd));
}
function alturaOSM(tg, tipo, area, x, z, r, ctx) {
  const pd = ctx.cfg.peDireito;
  const h = parseFloat(String(tg.height || '').replace(',', '.'));
  if (isFinite(h) && h > 1.5 && h < 300) return h;
  const nv = parseFloat(String(tg['building:levels'] || '').replace(',', '.'));
  if (isFinite(nv) && nv >= 1 && nv < 90) return nv * pd + (parseFloat(tg['roof:levels']) > 0 ? 1.6 : 0.6);
  switch (tipo) {
    case 'casa': return (r() < 0.8 ? 1 : 2) * pd + 0.6;
    case 'garagem': return 2.7;
    case 'industria': return 6.5 + r() * 5;
    case 'igreja': return 11 + r() * 9;
    case 'hospital': return (2 + Math.floor(r() * 3)) * pd + 1;
    case 'saude': return (1 + (r() < 0.25 ? 1 : 0)) * pd + 0.8;
    case 'escola': return (1 + Math.floor(r() * 2)) * pd + 1;
    case 'apartamentos': return (3 + Math.floor(r() * 6)) * pd + 1;
    default: {
      const zona = zonaEm(x, z, '', ctx);
      if (area < 140 && zona.nucleo < 0.5) return (r() < 0.75 ? 1 : 2) * pd + 0.6;
      return andaresPorZona(x, z, zona, r, ctx) * pd + 0.6;
    }
  }
}
function corPredio(tipo, bairroIdx, x, z, r, ctx) {
  const K = CORES, cfg = ctx.cfg;
  const t = new THREE.Color();
  switch (tipo) {
    case 'igreja': return t.copy(K.igreja);
    case 'hospital': return t.copy(K.hospital);
    case 'saude': return t.copy(K.saude);
    case 'escola': return t.copy(K.escola).offsetHSL(0, 0, (r() - 0.5) * 0.06);
    case 'industria': return t.copy(K.industria).offsetHSL(0, 0, (r() - 0.5) * 0.1);
    default: break;
  }
  if (cfg.coresPorBairro) {
    let pal;
    if (bairroIdx >= 0 && ctx.bairros[bairroIdx]) pal = ctx.bairros[bairroIdx].paleta;
    else pal = Math.min(PALETAS_DISTRITO.length - 1, Math.floor(ruido2(x / 900, z / 900, ctx.semente ^ 0x2545f491) * PALETAS_DISTRITO.length));
    const cores = K.paletas[pal];
    return t.copy(cores[Math.floor(r() * cores.length)]);
  }
  return t.setHSL(r(), 0.3 + r() * 0.35, 0.42 + r() * 0.22);

/* Decompõe plantas em L, U ou irregulares em retângulos (voxel), no referencial do OBB. */
function decomporPlanta(p, obb) {
  const c = Math.cos(obb.ang), s = Math.sin(obb.ang);
  const n = p.length >> 1;
  const q = new Float64Array(p.length);
  for (let k = 0; k < n; k++) {
    const dx = p[2 * k] - obb.cx, dz = p[2 * k + 1] - obb.cz;
    q[2 * k] = dx * c + dz * s; q[2 * k + 1] = -dx * s + dz * c;
  }
  const cel = clamp(Math.sqrt(obb.area) / 12, 1.2, 6);
  const nu = Math.max(1, Math.ceil(2 * obb.hu / cel)), nv = Math.max(1, Math.ceil(2 * obb.hv / cel));
  const cu = 2 * obb.hu / nu, cv = 2 * obb.hv / nv;
  const cheio = new Uint8Array(nu * nv);
  let total = 0;
  for (let j = 0; j < nv; j++) {
    for (let i = 0; i < nu; i++) {
      if (dentro(-obb.hu + (i + 0.5) * cu, -obb.hv + (j + 0.5) * cv, q)) { cheio[j * nu + i] = 1; total++; }
    }
  }
  if (!total) return null;
  const usado = new Uint8Array(nu * nv);
  const rets = [];
  for (let j = 0; j < nv; j++) {
    for (let i = 0; i < nu; i++) {
      const k0 = j * nu + i;
      if (!cheio[k0] || usado[k0]) continue;
      let i1 = i;
      while (i1 + 1 < nu && cheio[j * nu + i1 + 1] && !usado[j * nu + i1 + 1]) i1++;
      let j1 = j;
      linhas: while (j1 + 1 < nv) {
        for (let kk = i; kk <= i1; kk++) { const idx = (j1 + 1) * nu + kk; if (!cheio[idx] || usado[idx]) break linhas; }
        j1++;
      }
      for (let jj = j; jj <= j1; jj++) for (let ii = i; ii <= i1; ii++) usado[jj * nu + ii] = 1;
      const u0 = -obb.hu + i * cu, u1 = -obb.hu + (i1 + 1) * cu, v0 = -obb.hv + j * cv, v1 = -obb.hv + (j1 + 1) * cv;
      const uc = (u0 + u1) / 2, vc = (v0 + v1) / 2;
      rets.push({ cx: obb.cx + uc * c - vc * s, cz: obb.cz + uc * s + vc * c, hu: (u1 - u0) / 2, hv: (v1 - v0) / 2, ang: obb.ang });
      if (rets.length > 14) return null;
    }
  }
  return rets;
}

/* Emite um prédio (com escalonamento, telhado ou casa de máquinas) e registra os pavimentos para as janelas. */
function emitirPredio(res, ctx, b, r) {
  const cfg = ctx.cfg, K = CORES;
  const idx = res.predios.length;
  res.predios.push({
    x: b.cx, z: b.cz, h: b.h, andares: Math.max(1, Math.round(b.h / cfg.peDireito)), tipo: b.tipo, fonte: b.fonte,
    nome: b.nome || '', bairro: b.bairro, osm: b.osm || null, area: b.area || (4 * b.hu * b.hv), uso: b.uso || ''
  });
  const rotY = -b.ang;
  let su = b.hu * 2, sv = b.hv * 2, y = 0;
  const andares = Math.max(1, Math.round(b.h / cfg.peDireito));
  const escalonar = b.escalonar && andares >= 6 && r() < cfg.chanceRecuo;
  const recuo = clamp(Math.min(su, sv) * 0.12, 1, 3);
  const tom = new THREE.Color();
  let guarda = 0;
  while (y < b.h - 0.01 && su >= 3 && sv >= 3 && guarda++ < 6) {
    const resta = b.h - y;
    let hT = resta;
    if (escalonar && resta > 3 * cfg.peDireito && r() < cfg.chanceRecuo) {
      hT = Math.max(2 * cfg.peDireito, Math.round(resta * (0.35 + r() * 0.4) / cfg.peDireito) * cfg.peDireito);
      if (hT >= resta) hT = resta;
    }
    tom.copy(b.cor).offsetHSL(0, 0, Math.min(0.12, y * 0.0025));
    res.solidos.add(b.cx, y, b.cz, su, hT, sv, rotY, tom);
    res.donoArr.push(idx);
    res.pavimentos.push({ x: b.cx, z: b.cz, y0: y, h: hT, hu: su / 2, hv: sv / 2, ang: b.ang, baixo: andares <= 2, d: Math.hypot(b.cx - ctx.centro[0], b.cz - ctx.centro[1]) });
    y += hT;
    if (hT >= resta - 0.01) break;
    su -= 2 * recuo; sv -= 2 * recuo;
  }
  if (b.telhado && andares <= 2 && su >= 4 && sv >= 4) {
    const corT = tom.copy(K.telhado).offsetHSL((r() - 0.5) * 0.03, 0, (r() - 0.5) * 0.1);
    res.solidos.add(b.cx, y, b.cz, su + 0.5, 0.8, sv + 0.5, rotY, corT); res.donoArr.push(idx);
    if (su >= sv) res.solidos.add(b.cx, y + 0.8, b.cz, su + 0.5, 0.75, sv * 0.5, rotY, corT);
    else res.solidos.add(b.cx, y + 0.8, b.cz, su * 0.5, 0.75, sv + 0.5, rotY, corT);
    res.donoArr.push(idx);
  } else if (andares >= 6 && su >= 6 && sv >= 6) {
    const lado = Math.min(su, sv) * 0.3;
    res.solidos.add(b.cx, y, b.cz, lado, 2.6, lado, rotY, K.casaMaquinas); res.donoArr.push(idx);
  }
  return idx;
}

function emitirArvore(res, x, z, escala, r, densa) {
  const K = CORES;
  const ht = (1.4 + r() * 1.3) * escala;
  const cw = (densa ? 4.5 + r() * 4 : 3 + r() * 3) * escala;
  const ch = (densa ? 5 + r() * 4 : 3 + r() * 2.6) * escala;
  const rot = r() * Math.PI;
  res.solidos.add(x, 0, z, 0.55 * escala, ht, 0.55 * escala, rot, K.tronco); res.donoArr.push(-2);
  const verde = new THREE.Color().copy(K.arvore).offsetHSL((r() - 0.5) * 0.04, (r() - 0.5) * 0.1, (r() - 0.5) * 0.08);
  res.solidos.add(x, ht, z, cw, ch, cw, rot, verde); res.donoArr.push(-2);
  res.arvores++;
}

function emitirJanelasPavimento(T, J, cfg, r, limite) {
  const pd = cfg.peDireito;
  const linhas = Math.floor((T.h - 0.3) / pd);
  if (linhas < 1) return true;
  const c = Math.cos(T.ang), s = Math.sin(T.ang), rotY = -T.ang;
  const altV = Math.min(1.5, pd * 0.5);
  const prof = 0.14;
  const faces = T.baixo ? [[0, 1], [0, -1]] : [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (const f of faces) {
    const fu = f[0], fv = f[1];
    const larg = fu !== 0 ? 2 * T.hv : 2 * T.hu;
    if (larg < 2.2) continue;
    const cols = Math.max(1, Math.round(larg / (T.baixo ? 3.6 : 2.8)));
    const esp = larg / cols;
    const largV = Math.min(esp * 0.55, 1.8);
    const dist = (fu !== 0 ? T.hu : T.hv) + prof * 0.2;
    for (let lin = 0; lin < linhas; lin++) {
      const y = T.y0 + pd * (lin + 0.5) - altV / 2 + 0.15;
      for (let col = 0; col < cols; col++) {
        if (J.n >= limite) return false;
        if (r() > cfg.densidadeJanelas) continue;
        const off = -larg / 2 + esp * (col + 0.5);
        const lu = fu !== 0 ? fu * dist : off;
        const lv = fv !== 0 ? fv * dist : off;
        J.addJ(T.x + lu * c - lv * s, y, T.z + lu * s + lv * c, fu !== 0 ? prof : largV, altV, fv !== 0 ? prof : largV, rotY, r(), (r() - 0.5) * 0.16);
      }
    }
  }
  return true;
}

/* ---------- Geração completa ---------- */
async function gerarCidade(entrada, cfg, qual, aoProgresso) {
  const t0 = performance.now();
  prepararCores();
  const K = CORES;
  const bairros = entrada.bairros;
  const fat = criarFatiador(aoProgresso);
  const r = mulberry32(cfg.semente);
  const rJan = mulberry32(cfg.semente ^ 0x5bf03635);
  const rArv = mulberry32(cfg.semente ^ 0x0badf00d);
  const ctx = entrada.ctx;
  ctx.cfg = cfg; ctx.semente = cfg.semente; ctx.bairros = bairros;

  const res = {
    solidos: new Caixas(1 << 16), janelas: new Janelas(1 << 16), vias: new Caixas(1 << 14), calcadas: new Caixas(1 << 14), trilhos: new Caixas(1024),
    predios: [], donoArr: [], pavimentos: [], ruas: [], arvores: 0, pracas: [], stats: {}
  };

  /* 1. Ruas */
  await fat.agora(0.02, 'Traçando as ruas');
  const ruas = entrada.fonte === 'osm' ? entrada.modelo.ruas : gerarRuasIlustrativas(bairros, cfg, ctx);
  res.ruas = ruas;

  /* 2. Grade de ocupação */
  await fat.agora(0.06, 'Mapeando ocupação do solo');
  const bbB = caixaDosBairros(bairros);
  const G = new Grade({ minX: bbB.minX - 300, minZ: bbB.minZ - 300, maxX: bbB.maxX + 300, maxZ: bbB.maxZ + 300 }, qual.celula);
  for (const b of bairros) G.preencherPoligono(b.p, G.ba, b.i + 1, false);
  const areas = entrada.fonte === 'osm' ? entrada.modelo.areas : [];
  for (const a of areas) {
    if (a.k === 'agua') G.preencherPoligono(a.p, G.oc, OC.AGUA, false);
    else if (a.k === 'parque' || a.k === 'praca' || a.k === 'esporte' || a.k === 'cemiterio' || a.k === 'mata' || a.k === 'gramado') G.preencherPoligono(a.p, G.oc, a.k === 'praca' || a.k === 'parque' ? OC.PRACA : OC.VERDE, true);
  }
  if (entrada.fonte === 'osm') {
    for (const rio of entrada.modelo.rios) for (let i = 2; i < rio.p.length; i += 2) G.marcarCapsula(rio.p[i - 2], rio.p[i - 1], rio.p[i], rio.p[i + 1], rio.l / 2 + 3, OC.AGUA);
    for (const tr of entrada.modelo.trilhos) for (let i = 2; i < tr.p.length; i += 2) G.marcarCapsula(tr.p[i - 2], tr.p[i - 1], tr.p[i], tr.p[i + 1], 4, OC.TRILHO);
  }
  let cont = 0;
  for (const rua of ruas) {
    const urbana = !!VIAS_COM_LOTES[rua.cls];
    const meia = rua.l / 2;
    const calc = urbana && rua.piso !== 'terra' ? cfg.calcada : 0.6;
    for (let i = 2; i < rua.p.length; i += 2) {
      const ax = rua.p[i - 2], az = rua.p[i - 1], bx = rua.p[i], bz = rua.p[i + 1];
      G.marcarCapsula(ax, az, bx, bz, meia + calc, OC.CALCADA, (v) => v !== OC.VIA);
      G.marcarCapsula(ax, az, bx, bz, meia, OC.VIA);
    }
    if ((++cont & 63) === 0) await fat.talvez(0.06 + 0.12 * cont / ruas.length, 'Mapeando ocupação do solo');
  }
  if (entrada.fonte === 'osm') {
    for (const pr of entrada.modelo.predios) G.preencherPoligono(pr.p, G.oc, OC.PREDIO_OSM, false);
  }

  /* 3. Praças ilustrativas (no modo sem OSM) */
  if (entrada.fonte !== 'osm') {
    await fat.agora(0.2, 'Abrindo praças');
    const rP = mulberry32(cfg.semente ^ 0x77aa11);
    const maxCelCentro = Math.round((175 * 175) / (qual.celula * qual.celula));
    const maxCel = Math.round((140 * 140) / (qual.celula * qual.celula));
    for (const b of bairros) {
      const ehCentro = b === ctx.bairroCentro;
      if (!ehCentro && rP() > 0.5) continue;
      if (urbanizacao(b.rx, b.rz, ctx) < 0.5 && !ehCentro) continue;
      let feito = null;
      for (let tent = 0; tent < 28 && !feito; tent++) {
        const raio = tent === 0 ? 0 : 20 + tent * 9;
        const a = rP() * Math.PI * 2;

        const z = (tent < 8 ? b.rz : b.bb.minZ + rP() * (b.bb.maxZ - b.bb.minZ)) + Math.sin(a) * raio;
        if (!dentro(x, z, b.p) || G.valor(x, z) !== OC.LIVRE) continue;

    for (let i = 0; i < lista.length; i++) {

      const area = Math.abs(areaAssinada(pr.p));

      const obb = obbMinimo(pr.p);
