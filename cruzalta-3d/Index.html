      const rr = mulberry32((pr.id >>> 0) ^ cfg.semente);
      const tipo = classificarPredio(pr.tg, area);
      const h = alturaOSM(pr.tg, tipo, area, obb.cx, obb.cz, rr, ctx);
      const bi = G.bairro(obb.cx, obb.cz);
      const cor = corPredio(tipo, bi, obb.cx, obb.cz, rr, ctx);
      const preench = area / Math.max(1, 4 * obb.hu * obb.hv);
      const partes = (preench < 0.78 && area >= 140) ? (decomporPlanta(pr.p, obb) || [obb]) : [obb];
      const nome = pr.tg.name || '';
      const telhado = tipo === 'casa' && rr() < cfg.telhados;
      for (let k = 0; k < partes.length; k++) {
        const pt = partes[k];
        emitirPredio(res, ctx, { cx: pt.cx, cz: pt.cz, hu: pt.hu, hv: pt.hv, ang: pt.ang, h, cor, tipo, fonte: 'osm', nome,
          bairro: bi, osm: pr.tipoOsm + '/' + pr.id, area, telhado, escalonar: false }, rr);
      }
      nOSM++;
      if ((i & 127) === 0) await fat.talvez(0.22 + 0.2 * i / lista.length, 'Erguendo prédios do OpenStreetMap');
    }
  }

  /* 5. Lotes ao longo das ruas (cidade ilustrativa ou complemento do OSM) */
  let nGer = 0;
  const lotear = entrada.fonte !== 'osm' || cfg.preencherLotes;
  if (lotear) {
    const ordem = ruas.filter(x => VIAS_COM_LOTES[x.cls]).sort((a, b) => ((VIAS[b.cls] || { o: 0 }).o - (VIAS[a.cls] || { o: 0 }).o));
    const fatorBaixa = qual === QUALIDADES.baixa ? 1.35 : 1;
    for (let ri = 0; ri < ordem.length; ri++) {
      const rua = ordem[ri];
      const meia = rua.l / 2 + (rua.piso !== 'terra' ? cfg.calcada : 0.6);
      for (let i = 2; i < rua.p.length; i += 2) {
        const ax = rua.p[i - 2], az = rua.p[i - 1], bx = rua.p[i], bz = rua.p[i + 1];
        const L = Math.hypot(bx - ax, bz - az);
        if (L < 8) continue;
        const dx = (bx - ax) / L, dz = (bz - az) / L, nx = -dz, nz = dx;
        const ang = Math.atan2(dz, dx);
        for (const lado of [1, -1]) {
          let t = 1.5;
          let tent = 0;
          while (t < L - 3 && tent++ < 400) {
            const mx = ax + dx * t, mz = az + dz * t;
            const zona = zonaEm(mx, mz, rua.cls, ctx);
            let w = (zona.comercial ? cfg.testada * (0.9 + r() * 0.9) : cfg.testada * (0.75 + r() * 0.5)) * fatorBaixa;
            if (t + w > L) w = L - t;
            if (w < 5) break;
            const frente = zona.comercial ? 0.2 : cfg.recuoFrontal * (0.6 + r() * 0.8);
            let prof = zona.comercial ? cfg.profundidade * (1.2 + r() * 0.9) : cfg.profundidade * (0.65 + r() * 0.6);
            const afast = zona.comercial ? cfg.afastamento * 0.15 : cfg.afastamento;
            const hu = (w - 2 * afast) / 2;
            const urb = entrada.fonte === 'osm' ? 1 : urbanizacao(mx, mz, ctx);
            const densidade = (zona.comercial ? Math.max(cfg.densidadeComercial, 0.35) + 0.25 : cfg.densidadeResidencial + 0.2) *
              (1 - smoothstep(2400, 5600, zona.d) * 0.7) * smoothstep(0.2, 0.6, urb);
            if (hu < 1.8 || r() < cfg.chanceVazio || r() > densidade) { t += w; continue; }
            let hv = prof / 2;
            let cx = mx + dx * (w / 2) + nx * lado * (meia + frente + hv);
            let cz = mz + dz * (w / 2) + nz * lado * (meia + frente + hv);
            let ok = G.obbLivre(cx, cz, hu, hv, dx, dz, true);
            if (!ok) {
              hv = prof * 0.32;
              cx = mx + dx * (w / 2) + nx * lado * (meia + frente + hv);
              cz = mz + dz * (w / 2) + nz * lado * (meia + frente + hv);
              ok = hv >= 2.5 && G.obbLivre(cx, cz, hu, hv, dx, dz, true);
            }
            if (!ok) { t += w * 0.5; continue; }
            G.marcarOBB(cx, cz, hu + afast * 0.5, hv + 1, dx, dz, OC.PREDIO);
            const bi = G.bairro(cx, cz);
            const andares = andaresPorZona(cx, cz, zona, r, ctx);
            const h = andares * cfg.peDireito + 0.6;
            const tipo = zona.comercial ? (andares >= 5 ? 'apartamentos' : 'comercial') : (andares <= 2 ? 'casa' : 'apartamentos');
            const cor = corPredio(tipo === 'casa' || tipo === 'apartamentos' || tipo === 'comercial' ? 'generico' : tipo, bi, cx, cz, r, ctx);
            emitirPredio(res, ctx, { cx, cz, hu, hv, ang, h, cor, tipo, fonte: 'gerado', bairro: bi, area: 4 * hu * hv,
              telhado: !zona.comercial && r() < cfg.telhados, escalonar: true, uso: zona.comercial ? 'Comercial' : 'Residencial' }, r);
            nGer++;
            t += w;
          }
        }
      }
      if ((ri & 31) === 0) await fat.talvez(0.42 + 0.3 * ri / ordem.length, 'Loteando quadras (' + fmtNum(nGer) + ' prédios)');
    }
  }

  /* 6. Árvores */
  await fat.agora(0.74, 'Plantando árvores');
  const limiteArv = qual.arvores;
  if (entrada.fonte === 'osm') {
    for (const a of areas) {
      const dens = { parque: 1 / 340, praca: 1 / 300, mata: 1 / 110, cemiterio: 1 / 650, gramado: 1 / 1600, esporte: 0 }[a.k];
      if (!dens) continue;
      const area = Math.abs(areaAssinada(a.p));
      let n = Math.round(area * dens);
      if (a.k === 'parque' || a.k === 'praca') n += cfg.arvoresMin + Math.floor(rArv() * (cfg.arvoresVariacao + 1));
      n = Math.min(n, 600);
      const bb = caixa(a.p);
      let tent = 0;
      while (n > 0 && tent++ < n * 6 + 30 && res.arvores < limiteArv) {
        const x = bb.minX + rArv() * (bb.maxX - bb.minX), z = bb.minZ + rArv() * (bb.maxZ - bb.minZ);
        if (!dentro(x, z, a.p)) continue;
        const v = G.valor(x, z);
        if (v !== OC.VERDE && v !== OC.PRACA && v !== OC.LIVRE && v !== 255) continue;
        emitirArvore(res, x, z, 1, rArv, a.k === 'mata');
        n--;
      }
    }
  }
  for (const pc of res.pracas) {
    let n = cfg.arvoresMin + Math.floor(rArv() * (cfg.arvoresVariacao + 1)) + Math.round(pc.celulas.length * qual.celula * qual.celula / 700);
    n = Math.min(n, 220);
    for (let k = 0; k < n && res.arvores < limiteArv; k++) {
      const cel = pc.celulas[Math.floor(rArv() * pc.celulas.length)];
      const i = cel % G.nx, j = (cel - i) / G.nx;
      emitirArvore(res, G.cx(i) + (rArv() - 0.5) * G.cel, G.cz(j) + (rArv() - 0.5) * G.cel, 1, rArv, false);
    }
  }
  if (cfg.arvoresCalcada > 0) {
    for (let ri = 0; ri < ruas.length && res.arvores < limiteArv; ri++) {
      const rua = ruas[ri];
      if (!VIAS_COM_LOTES[rua.cls] || rua.piso === 'terra') continue;
      const off = rua.l / 2 + cfg.calcada * 0.55;
      for (let i = 2; i < rua.p.length; i += 2) {
        const ax = rua.p[i - 2], az = rua.p[i - 1], bx = rua.p[i], bz = rua.p[i + 1];
        const L = Math.hypot(bx - ax, bz - az);
        if (L < 10) continue;
        const dx = (bx - ax) / L, dz = (bz - az) / L;
        for (const lado of [1, -1]) {
          for (let t = 6; t < L - 4; t += 13 + rArv() * 8) {
            if (rArv() > cfg.arvoresCalcada) continue;
            const x = ax + dx * t - dz * lado * off, z = az + dz * t + dx * lado * off;
            const k = G.indice(x, z);
            if (k < 0 || G.oc[k] !== OC.CALCADA) continue;
            G.oc[k] = OC.ARVORE;
            emitirArvore(res, x, z, 0.8, rArv, false);
            if (res.arvores >= limiteArv) break;
          }
        }
      }
      if ((ri & 63) === 0) await fat.talvez(0.76 + 0.04 * ri / ruas.length, 'Arborizando calçadas');
    }
  }

  /* 7. Vias, calçadas e trilhos */
  await fat.agora(0.82, 'Pavimentando ruas');
  let segs = 0;
  for (let ri = 0; ri < ruas.length; ri++) {
    const rua = ruas[ri];
    const cor = rua.piso === 'terra' ? K.terra : (rua.piso === 'calcamento' ? K.calcamento : K.asfalto);
    const urbana = !!VIAS_COM_LOTES[rua.cls] && rua.piso !== 'terra' && cfg.calcada > 0;
    for (let i = 2; i < rua.p.length; i += 2) {
      const ax = rua.p[i - 2], az = rua.p[i - 1], bx = rua.p[i], bz = rua.p[i + 1];
      const L = Math.hypot(bx - ax, bz - az);
      if (L < 0.3) continue;
      const ang = Math.atan2(bz - az, bx - ax);
      const mx = (ax + bx) / 2, mz = (az + bz) / 2;
      res.vias.add(mx, 0, mz, L + rua.l * 0.5, rua.piso === 'terra' ? 0.1 : 0.14, rua.l, -ang, cor);
      if (urbana) res.calcadas.add(mx, 0, mz, L + rua.l * 0.5 + cfg.calcada, 0.08, rua.l + 2 * cfg.calcada, -ang, K.calcada);
      segs++;
    }
    if ((ri & 255) === 0) await fat.talvez(0.82 + 0.06 * ri / ruas.length, 'Pavimentando ruas');
  }
  if (entrada.fonte === 'osm') {
    for (const tr of entrada.modelo.trilhos) {
      for (let i = 2; i < tr.p.length; i += 2) {
        const ax = tr.p[i - 2], az = tr.p[i - 1], bx = tr.p[i], bz = tr.p[i + 1];
        const L = Math.hypot(bx - ax, bz - az);
        if (L < 0.3) continue;
        const ang = Math.atan2(bz - az, bx - ax), mx = (ax + bx) / 2, mz = (az + bz) / 2;
        res.trilhos.add(mx, 0, mz, L + 1.5, 0.3, 3.4, -ang, K.lastro);
        if (tr.ativo) {
          const nx = -Math.sin(ang) * 0.72, nz = Math.cos(ang) * 0.72;
          res.trilhos.add(mx + nx, 0.3, mz + nz, L + 0.4, 0.16, 0.22, -ang, K.trilho);
          res.trilhos.add(mx - nx, 0.3, mz - nz, L + 0.4, 0.16, 0.22, -ang, K.trilho);
        }
      }
    }
  }

  /* 8. Janelas: do centro para fora, até o limite da qualidade escolhida */
  await fat.agora(0.9, 'Abrindo janelas');
  if (cfg.densidadeJanelas > 0) {
    const pav = res.pavimentos.slice().sort((a, b) => a.d - b.d);
    for (let i = 0; i < pav.length; i++) {
      if (!emitirJanelasPavimento(pav[i], res.janelas, cfg, rJan, qual.janelas)) break;
      if ((i & 511) === 0) await fat.talvez(0.9 + 0.08 * i / pav.length, 'Abrindo janelas (' + fmtNum(res.janelas.n) + ')');
    }
  }

  res.dono = Int32Array.from(res.donoArr);
  res.donoArr = null;
  res.pavimentos = null;
  res.stats = {
    ruas: ruas.length, segmentos: segs, prediosOSM: nOSM, prediosGerados: nGer, predios: res.predios.length,
    caixas: res.solidos.n, janelas: res.janelas.n, arvores: res.arvores, pracas: res.pracas.length,
    tempoMs: Math.round(performance.now() - t0), celula: qual.celula
  };
  await fat.agora(1, 'Montando a maquete');
  return res;
}

/* ---------- Chão: lavouras ao redor, solo urbano por bairro, praças, água ---------- */
function corTintaBairro(paleta) {
  const matizes = [220, 25, 130, 260, 30];
  return 'hsl(' + matizes[paleta % matizes.length] + ', 10%, 63%)';
}
function pintarChao(entrada, cfg, qual) {
  const bairros = entrada.bairros;
  const bbB = caixaDosBairros(bairros);
  const margem = 2600;
  const cxm = (bbB.minX + bbB.maxX) / 2, czm = (bbB.minZ + bbB.maxZ) / 2;
  const lado = Math.max(bbB.maxX - bbB.minX, bbB.maxZ - bbB.minZ) + 2 * margem;
  const bb = { minX: cxm - lado / 2, maxX: cxm + lado / 2, minZ: czm - lado / 2, maxZ: czm + lado / 2 };
  const N = Math.min(qual.textura, entrada.ctx.maxTextura || 4096);
  const esc = N / lado;
  const cv = document.createElement('canvas');
  cv.width = N; cv.height = N;
  const g = cv.getContext('2d');
  const X = (x) => (x - bb.minX) * esc, Z = (z) => (z - bb.minZ) * esc;
  const caminho = (p) => {
    g.beginPath();
    g.moveTo(X(p[0]), Z(p[1]));
    for (let i = 2; i < p.length; i += 2) g.lineTo(X(p[i]), Z(p[i + 1]));
    g.closePath();
  };
  /* Campos rurais (Planalto Médio: soja, trigo, milho, solo vermelho) */
  g.fillStyle = COR.rural;
  g.fillRect(0, 0, N, N);
  const r = mulberry32(cfg.semente ^ 0xa5a5a5);
  g.save();
  g.translate(N / 2, N / 2);
  g.rotate(0.21);
  const passo = 330 * esc;
  const meio = N * 0.75;
  for (let gx = -meio; gx < meio; gx += passo) {
    for (let gz = -meio; gz < meio; gz += passo * 0.72) {
      g.fillStyle = CAMPOS_RURAIS[Math.floor(r() * CAMPOS_RURAIS.length)];
      const w = passo * (0.7 + r() * 0.6), h = passo * 0.72 * (0.8 + r() * 0.4);
      g.fillRect(gx + 2, gz + 2, Math.max(1, w - 4), Math.max(1, h - 4));
    }
  }
  g.restore();
  const vinheta = g.createRadialGradient(N / 2, N / 2, N * 0.34, N / 2, N / 2, N * 0.5);
  vinheta.addColorStop(0, 'rgba(0,0,0,0)');
  vinheta.addColorStop(1, COR.rural);
  const modelo = entrada.fonte === 'osm' ? entrada.modelo : null;
  if (modelo) {
    for (const a of modelo.areas) {
      if (a.k !== 'lavoura') continue;
      g.fillStyle = CAMPOS_RURAIS[hashTexto(a.p.length + ':' + Math.round(a.p[0])) % CAMPOS_RURAIS.length];
      caminho(a.p); g.fill();
    }
    for (const a of modelo.areas) {
      if (a.k !== 'urbano' && a.k !== 'industrial') continue;
      g.fillStyle = a.k === 'industrial' ? 'hsl(210, 6%, 60%)' : COR.chaoUrbano;
      caminho(a.p); g.fill();
    }
  }
  g.fillStyle = vinheta;
  g.fillRect(0, 0, N, N);
  /* Solo urbano dos bairros (levemente tingido pela paleta do bairro) */
  for (const b of bairros) {
    g.fillStyle = cfg.coresPorBairro ? corTintaBairro(b.paleta) : COR.chaoUrbano;
    caminho(b.p); g.fill();
  }
  if (modelo) {
    const corArea = { parque: COR.parque, praca: COR.parque, esporte: COR.esporte, cemiterio: COR.cemiterio, mata: 'hsl(110, 30%, 30%)', gramado: 'hsl(95, 30%, 48%)', agua: COR.agua };
    for (const k of ['gramado', 'mata', 'cemiterio', 'parque', 'praca', 'esporte', 'agua']) {
      g.fillStyle = corArea[k];
      for (const a of modelo.areas) if (a.k === k) { caminho(a.p); g.fill(); }
    }
    g.strokeStyle = COR.agua;
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (const rio of modelo.rios) {
      g.lineWidth = Math.max(1, rio.l * esc);
      g.beginPath();
      g.moveTo(X(rio.p[0]), Z(rio.p[1]));
      for (let i = 2; i < rio.p.length; i += 2) g.lineTo(X(rio.p[i]), Z(rio.p[i + 1]));
      g.stroke();
    }
  }
  return { canvas: cv, bb, lado };
}

/* =====================================================================
   CENA 3D (three.js r147 + OrbitControls)
   ===================================================================== */
const cena = {
  pronta: false, renderer: null, scene: null, camera: null, controles: null, sol: null, ambiente: null, nevoa: null,
  geoCaixa: null, mat: {}, malhas: {}, chaoBase: null, chao: null, texturaChao: null, limites: null, destaque: null,
  marcadores: null, aneis: null, precisaRender: true, redimensionar: false, voo: null, estadoSolar: null,
  ultimo: 0, ultimaLuz: 0, raycaster: null, cores: null, pinos: [], rotulosBairro: [], rotulosLocais: [], quadros: 0
};
const ALTURA_HASTE = 36;

function coresCena() {
  if (cena.cores) return cena.cores;
  const C = (s) => new THREE.Color(s);
  cena.cores = {
    ceuDia: C(COR.ceuDia), ceuCrepusculo: C(COR.ceuCrepusculo), ceuNoite: C(COR.ceuNoite),
    solDia: C(COR.solDia), solCrepusculo: C(COR.solCrepusculo),
    ambienteDia: C(COR.ambienteDia), ambienteNoite: C(COR.ambienteNoite),
    janelaAcesa: C(COR.janelaAcesa), janelaEscura: C(COR.janelaEscura)
  };
  return cena.cores;
}

function criarCena(palco, qual) {
  THREE.ColorManagement.legacyMode = false;
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: false });
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.physicallyCorrectLights = true;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, qual.razaoPixel));
  const w = Math.max(1, palco.clientWidth), h = Math.max(1, palco.clientHeight);
  renderer.setSize(w, h, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.domElement.setAttribute('aria-hidden', 'true');
  palco.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(COR.ceuDia);
  const nevoa = new THREE.Fog(new THREE.Color(COR.ceuDia), 3000, 20000);
  scene.fog = nevoa;

  const camera = new THREE.PerspectiveCamera(45, w / h, 1, 90000);
  camera.position.set(1500, 6000, 7000);

  const controles = new THREE.OrbitControls(camera, renderer.domElement);
  controles.enableDamping = true;
  controles.dampingFactor = 0.08;
  controles.screenSpacePanning = false;
  controles.maxPolarAngle = Math.PI * 0.47;
  controles.minDistance = 22;
  controles.maxDistance = 26000;
  controles.zoomSpeed = 1.15;
  controles.rotateSpeed = 0.6;
  controles.keyPanSpeed = 24;
  controles.listenToKeyEvents(palco);
  controles.addEventListener('change', () => { cena.precisaRender = true; });
  controles.addEventListener('start', () => { cena.voo = null; pararTour(true); });

  const sol = new THREE.DirectionalLight(COR.solDia, SOL_INTENSIDADE_MAX);
  sol.castShadow = true;
  sol.shadow.mapSize.set(qual.sombra, qual.sombra);
  sol.shadow.bias = -0.0003;
  sol.shadow.normalBias = 0.5;
  scene.add(sol);
  scene.add(sol.target);
  const ambiente = new THREE.AmbientLight(COR.ambienteDia, 0.9);
  scene.add(ambiente);

  const chaoBase = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshLambertMaterial({ color: COR.rural }));
  chaoBase.rotation.x = -Math.PI / 2;
  chaoBase.position.y = -0.35;
  chaoBase.scale.set(180000, 180000, 1);
  scene.add(chaoBase);

  Object.assign(cena, { renderer, scene, camera, controles, sol, ambiente, nevoa, chaoBase });
  cena.geoCaixa = new THREE.BoxGeometry(1, 1, 1);
  cena.mat = {
    solidos: new THREE.MeshLambertMaterial({ color: 0xffffff }),
    janelas: new THREE.MeshBasicMaterial({ color: 0xffffff }),
    vias: new THREE.MeshLambertMaterial({ color: 0xffffff }),
    calcadas: new THREE.MeshLambertMaterial({ color: 0xffffff }),
    trilhos: new THREE.MeshLambertMaterial({ color: 0xffffff }),
    destaque: new THREE.MeshBasicMaterial({ color: COR.destaque, transparent: true, opacity: 0.92, depthWrite: false })
  };
  cena.raycaster = new THREE.Raycaster();
  coresCena();
  aplicarModoNavegacao(estado.cfg.navegacao);
  cena.pronta = true;
}

function aplicarModoNavegacao(modo) {
  const c = cena.controles;
  if (!c) return;
  if (modo === 'orbita') {
    c.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    c.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
  } else {
    c.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
    c.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };
  }
  const btn = $('#btnNavegacao');
  if (btn) {
    btn.innerHTML = ic(modo === 'orbita' ? 'girar' : 'mover');
    btn.title = modo === 'orbita'
      ? 'Modo órbita: arrastar gira a vista; botão direito move. Clique para o modo mapa.'
      : 'Modo mapa: arrastar move; botão direito ou dois dedos giram. Clique para o modo órbita.';
  }
}

/* ---------- Malhas instanciadas ---------- */
function criarMalhaInstanciada(caixas, material, castShadow, receiveShadow) {
  if (!caixas || caixas.n === 0) return null;
  const n = caixas.n;
  const malha = new THREE.InstancedMesh(cena.geoCaixa, material, n);
  malha.instanceMatrix = new THREE.InstancedBufferAttribute(caixas.m.slice(0, n * 16), 16);
  malha.instanceColor = new THREE.InstancedBufferAttribute(caixas.c.slice(0, n * 3), 3);
  malha.frustumCulled = false;
  malha.castShadow = !!castShadow;
  malha.receiveShadow = !!receiveShadow;
  malha.matrixAutoUpdate = false;
  malha.updateMatrix();
  return malha;
}
function descartarMalha(m) {
  if (!m) return;
  cena.scene.remove(m);
  if (m.dispose) m.dispose();
}
function montarMalhasCidade(cid) {
  ['solidos', 'janelas', 'vias', 'calcadas', 'trilhos'].forEach(k => { descartarMalha(cena.malhas[k]); cena.malhas[k] = null; });
  cena.malhas.solidos = criarMalhaInstanciada(cid.solidos, cena.mat.solidos, true, true);
  cena.malhas.janelas = criarMalhaInstanciada(cid.janelas, cena.mat.janelas, false, false);
  cena.malhas.vias = criarMalhaInstanciada(cid.vias, cena.mat.vias, false, true);
  cena.malhas.calcadas = criarMalhaInstanciada(cid.calcadas, cena.mat.calcadas, false, true);
  cena.malhas.trilhos = criarMalhaInstanciada(cid.trilhos, cena.mat.trilhos, false, true);
  ['calcadas', 'vias', 'trilhos', 'solidos', 'janelas'].forEach(k => { if (cena.malhas[k]) cena.scene.add(cena.malhas[k]); });
  aplicarExagero();
  aplicarCamadas();
  recolorirJanelas();
  cena.precisaRender = true;
}
function montarChao(pintura) {
  if (cena.chao) { cena.scene.remove(cena.chao); cena.chao.geometry.dispose(); cena.chao.material.dispose(); }
  if (cena.texturaChao) cena.texturaChao.dispose();
  const tex = new THREE.CanvasTexture(pintura.canvas);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = Math.min(8, cena.renderer.capabilities.getMaxAnisotropy());
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  const geo = new THREE.PlaneGeometry(pintura.lado, pintura.lado);
  const mat = new THREE.MeshLambertMaterial({ map: tex });
  const chao = new THREE.Mesh(geo, mat);
  chao.rotation.x = -Math.PI / 2;
  chao.position.set((pintura.bb.minX + pintura.bb.maxX) / 2, 0, (pintura.bb.minZ + pintura.bb.maxZ) / 2);
  chao.receiveShadow = true;
  cena.scene.add(chao);
  cena.chao = chao;
  cena.texturaChao = tex;
}
function montarLimites(bairros) {
  if (cena.limites) { cena.scene.remove(cena.limites); cena.limites.geometry.dispose(); cena.limites.material.dispose(); }
  const pos = [];
  for (const b of bairros) {
    const n = b.p.length >> 1;
    for (let i = 0, j = n - 1; i < n; j = i++) pos.push(b.p[2 * j], 0.7, b.p[2 * j + 1], b.p[2 * i], 0.7, b.p[2 * i + 1]);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const mat = new THREE.LineBasicMaterial({ color: COR.limiteBairro, transparent: true, opacity: 0.6, depthWrite: false });
  cena.limites = new THREE.LineSegments(geo, mat);
  cena.limites.renderOrder = 2;
  cena.scene.add(cena.limites);
}
function destacarBairro(b) {
  descartarMalha(cena.destaque);
  cena.destaque = null;
  if (!b) { cena.precisaRender = true; return; }
  const largura = clamp(Math.sqrt(b.area) / 90, 4, 22);
  const cx = new Caixas((b.p.length >> 1) + 2);
  const cor = new THREE.Color(COR.destaque);
  const n = b.p.length >> 1;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const ax = b.p[2 * j], az = b.p[2 * j + 1], bx = b.p[2 * i], bz = b.p[2 * i + 1];
    const L = Math.hypot(bx - ax, bz - az);
    if (L < 0.2) continue;
    cx.add((ax + bx) / 2, 0.45, (az + bz) / 2, L + largura, 0.5, largura, -Math.atan2(bz - az, bx - ax), cor);
  }
  cena.destaque = criarMalhaInstanciada(cx, cena.mat.destaque, false, false);
  if (cena.destaque) { cena.destaque.renderOrder = 3; cena.scene.add(cena.destaque); }
  cena.precisaRender = true;
}

function aplicarExagero() {
  const k = estado.cfg.exageroVertical || 1;
  ['solidos', 'janelas'].forEach(nome => {
    const m = cena.malhas[nome];
    if (!m) return;
    m.scale.y = k;
    m.updateMatrix();
  });
  atualizarLegenda();
  cena.precisaRender = true;
}

/* ---------- Marcadores 3D das unidades (haste + cubo) ---------- */
function montarMarcadores() {
  if (cena.marcadores) {
    cena.scene.remove(cena.marcadores);
    cena.marcadores.traverse(o => { if (o.material) o.material.dispose(); });
  }
  if (cena.aneis) { cena.scene.remove(cena.aneis); cena.aneis.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); }
  const grupo = new THREE.Group(), aneis = new THREE.Group();
  if (!cena.geoHaste) { cena.geoHaste = new THREE.CylinderGeometry(1, 1, 1, 8); cena.geoHaste.translate(0, 0.5, 0); }
  for (const u of itensNoMapa()) {
    const cor = new THREE.Color(u.cor);
    const mat = new THREE.MeshBasicMaterial({ color: cor });
    const haste = new THREE.Mesh(cena.geoHaste, mat);
    haste.position.set(u.x, 0, u.z);
    haste.userData = { item: u.chave, tipo: 'haste' };
    const cab = new THREE.Mesh(cena.geoCaixa, mat);
    cab.userData = { item: u.chave, tipo: 'cabeca' };
    cab.position.set(u.x, ALTURA_HASTE, u.z);
    grupo.add(haste, cab);
    if (u.aproximada) {
      const anel = new THREE.Mesh(new THREE.RingGeometry(118, 126, 48), new THREE.MeshBasicMaterial({ color: cor, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide }));
      anel.rotation.x = -Math.PI / 2;
      anel.position.set(u.x, 0.9, u.z);
      aneis.add(anel);
    }
  }
  cena.marcadores = grupo; cena.aneis = aneis;
  cena.scene.add(grupo); cena.scene.add(aneis);
  ajustarEscalaMarcadores(true);
  cena.precisaRender = true;
}
function ajustarEscalaMarcadores(forcar) {
  if (!cena.marcadores) return;
  const d = cena.camera.position.distanceTo(cena.controles.target);
  const e = clamp(d / 1700, 0.45, 7);
  if (!forcar && cena.escalaMarc && Math.abs(cena.escalaMarc - e) / e < 0.03) return;
  cena.escalaMarc = e;
  for (const o of cena.marcadores.children) {
    if (o.userData.tipo === 'haste') o.scale.set(1.1 * e, ALTURA_HASTE * e, 1.1 * e);
    else { o.scale.set(7 * e, 7 * e, 7 * e); o.position.y = ALTURA_HASTE * e + 3.5 * e; }
  }
}

/* ---------- Sol real de Cruz Alta (NOAA simplificado) e ciclo do dia ---------- */
function estadoSolar(hora, dataISO) {
  let d = dataISO ? new Date(dataISO + 'T12:00:00') : new Date();
  if (isNaN(d.getTime())) d = new Date();
  const ini = new Date(d.getFullYear(), 0, 1);
  const N = Math.floor((d - ini) / 86400000) + 1;
  const g = 2 * Math.PI / 365 * (N - 1 + (hora - 12) / 24);
  const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) -
    0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const tst = hora * 60 + eqt + 4 * ORIGEM.lon - 60 * FUSO_HORARIO;
  const ha = (tst / 4 - 180) * Math.PI / 180;
  const lat = ORIGEM.lat * Math.PI / 180;
  const cosZ = clamp(Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(ha), -1, 1);
  const zen = Math.acos(cosZ);
  const elev = Math.PI / 2 - zen;
  let az = 0;
  const den = Math.cos(lat) * Math.sin(zen);
  if (Math.abs(den) > 1e-9) {
    const a = Math.acos(clamp((Math.sin(lat) * cosZ - Math.sin(decl)) / den, -1, 1)) * 180 / Math.PI;
    az = ha > 0 ? (a + 180) % 360 : (540 - a) % 360;
  }
  const azR = az * Math.PI / 180, ch = Math.cos(elev);
  return {
    dirX: Math.sin(azR) * ch, dirY: Math.sin(elev), dirZ: -Math.cos(azR) * ch,
    elevacao: Math.sin(elev), elevGraus: elev * 180 / Math.PI, azimute: az, fatorDia: smoothstep(-0.3, 0.3, Math.sin(elev))
  };
}
function corCeu(s) {
  const K = coresCena();
  return s.fatorDia < 0.5
    ? K.ceuNoite.clone().lerp(K.ceuCrepusculo, smoothstep(0, 0.5, s.fatorDia))
    : K.ceuCrepusculo.clone().lerp(K.ceuDia, smoothstep(0.5, 1, s.fatorDia));
}
function aplicarLuz() {
  if (!cena.pronta) return;
  const cfg = estado.cfg, K = coresCena();
  const s = estadoSolar(cfg.hora, cfg.data);
  cena.estadoSolar = s;
  const ceu = corCeu(s);
  cena.scene.background.copy(ceu);
  cena.nevoa.color.copy(ceu);
  cena.sol.intensity = SOL_INTENSIDADE_MAX * smoothstep(-0.1, 0.3, s.elevacao);
  cena.sol.color.copy(K.solCrepusculo).lerp(K.solDia, smoothstep(0.05, 0.4, s.elevacao));
  cena.sol.castShadow = !!cfg.sombras && s.elevacao > 0.015;
  cena.ambiente.color.copy(K.ambienteNoite).lerp(K.ambienteDia, s.fatorDia);
  cena.ambiente.intensity = lerp(1.15, 0.9, s.fatorDia);
  $('#centro').style.background = '#' + ceu.getHexString();
  posicionarSol();
  recolorirJanelas();
  atualizarHoraUI();
  cena.precisaRender = true;
}
function posicionarSol() {
  const s = cena.estadoSolar;
  if (!s) return;
  const alvo = cena.controles.target;
  const dist = cena.camera.position.distanceTo(alvo);
  const ext = clamp(dist * 0.85, 140, 7000);
  const texel = (2 * ext) / cena.sol.shadow.mapSize.x;
  const cx = Math.round(alvo.x / texel) * texel, cz = Math.round(alvo.z / texel) * texel;
  const dy = Math.max(s.dirY, 0.08);
  const len = Math.hypot(s.dirX, dy, s.dirZ);
  const R = ext * 3;
  cena.sol.position.set(cx + s.dirX / len * R, dy / len * R, cz + s.dirZ / len * R);
  cena.sol.target.position.set(cx, 0, cz);
  cena.sol.target.updateMatrixWorld();
  const cam = cena.sol.shadow.camera;
  const e = ext * clamp(1 / Math.max(dy / len, 0.25), 1, 2);
  if (cam.right !== e || cam.far !== R + e * 2 + 500) {
    cam.left = -e; cam.right = e; cam.top = e; cam.bottom = -e;
    cam.near = 1; cam.far = R + e * 2 + 500;
    cam.updateProjectionMatrix();
  }
  cena.sol.shadow.normalBias = clamp(texel * 0.9, 0.05, 6);
}
function paletaJanelas() {
  const K = coresCena();
  const s = cena.estadoSolar || estadoSolar(estado.cfg.hora, estado.cfg.data);
  const ceu = corCeu(s);
  return {
    acesa: K.janelaAcesa,
    escura: K.janelaEscura.clone().lerp(ceu.clone().multiplyScalar(0.55), s.fatorDia),
    chance: estado.cfg.chanceAcesas * (1 - s.fatorDia)
  };
}
function recolorirJanelas() {
  const malha = cena.malhas.janelas, cid = estado.cidade;
  if (!malha || !cid) return;
  const J = cid.janelas, pal = paletaJanelas();
  const arr = malha.instanceColor.array;
  const A = pal.acesa, E = pal.escura, ch = pal.chance;
  for (let i = 0; i < J.n; i++) {
    const b = J.sorteio[i] < ch ? A : E;
    const f = 1 + J.brilho[i];
    const q = i * 3;
    arr[q] = b.r * f; arr[q + 1] = b.g * f; arr[q + 2] = b.b * f;
  }
  malha.instanceColor.needsUpdate = true;
  cena.precisaRender = true;
}

/* ---------- Câmera, voo e vistas ---------- */
function vistaInicial() {
  const c = estado.ctxGeracao.centro;
  const dist = cena.camera.aspect < 1 ? 4200 : 3100;
  voarPara(c[0], c[1] + 250, dist, { polar: 0.98, azimute: 0.45, duracao: 0 });
}
function vistaCidadeInteira(animado) {
  const bb = caixaDosBairros(estado.bairros);
  const cx = (bb.minX + bb.maxX) / 2, cz = (bb.minZ + bb.maxZ) / 2;
  const raio = Math.max(bb.maxX - bb.minX, bb.maxZ - bb.minZ);
  const dist = raio * 1.12 * (cena.camera.aspect < 1 ? 1.55 : 1);
  voarPara(cx, cz, dist, { polar: 0.92, azimute: 0.32, duracao: animado ? 1400 : 0 });
}
function voarPara(x, z, dist, opcoes) {
  const o = opcoes || {};
  const ctrl = cena.controles, cam = cena.camera;
  const esfIni = new THREE.Spherical().setFromVector3(cam.position.clone().sub(ctrl.target));
  const polar = o.polar !== undefined ? o.polar : clamp(esfIni.phi, 0.3, 1.05);
  const theta = o.azimute !== undefined ? o.azimute : esfIni.theta;
  const raio = clamp(dist || esfIni.radius, ctrl.minDistance, ctrl.maxDistance);
  if (!o.duracao) {
    ctrl.target.set(x, 0, z);
    cam.position.copy(new THREE.Vector3().setFromSpherical(new THREE.Spherical(raio, polar, theta)).add(ctrl.target));
    cam.lookAt(ctrl.target);
    ctrl.update();
    cena.voo = null;
    cena.precisaRender = true;
    return;
  }
  let dT = theta - esfIni.theta;
  while (dT > Math.PI) dT -= 2 * Math.PI;
  while (dT < -Math.PI) dT += 2 * Math.PI;
  const salto = ctrl.target.distanceTo(new THREE.Vector3(x, 0, z));
  cena.voo = {
    t0: performance.now(), dur: o.duracao, alvoIni: ctrl.target.clone(), alvoFim: new THREE.Vector3(x, 0, z),
    r0: esfIni.radius, r1: raio, p0: esfIni.phi, p1: polar, t0a: esfIni.theta, dT,
    arco: clamp(salto / Math.max(esfIni.radius, raio), 0, 1.2) * 0.45
  };
  cena.precisaRender = true;
}
function atualizarVoo(agora) {
  const v = cena.voo;
  const k = clamp((agora - v.t0) / v.dur, 0, 1);
  const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const ctrl = cena.controles;
  ctrl.target.lerpVectors(v.alvoIni, v.alvoFim, e);
  const r = lerp(v.r0, v.r1, e) * (1 + v.arco * Math.sin(Math.PI * e));
  const esf = new THREE.Spherical(r, lerp(v.p0, v.p1, e), v.t0a + v.dT * e);
  cena.camera.position.setFromSpherical(esf).add(ctrl.target);
  cena.camera.lookAt(ctrl.target);
  if (k >= 1) cena.voo = null;
}
function aproximar(fator) {
  const ctrl = cena.controles, cam = cena.camera;
  const off = cam.position.clone().sub(ctrl.target);
  const alvoR = clamp(off.length() * fator, ctrl.minDistance, ctrl.maxDistance);
  voarPara(ctrl.target.x, ctrl.target.z, alvoR, { duracao: 450 });
}
function alternarVistaTopo() {
  const esf = new THREE.Spherical().setFromVector3(cena.camera.position.clone().sub(cena.controles.target));
  const deCima = esf.phi < 0.2;
  voarPara(cena.controles.target.x, cena.controles.target.z, esf.radius, { polar: deCima ? 0.92 : 0.05, duracao: 700 });
  $('#btnVistaTopo').classList.toggle('ativo', !deCima);
}
function apontarNorte() {
  const esf = new THREE.Spherical().setFromVector3(cena.camera.position.clone().sub(cena.controles.target));
  voarPara(cena.controles.target.x, cena.controles.target.z, esf.radius, { azimute: 0, duracao: 700 });
}
function limitarAlvo() {
  const t = cena.controles.target;
  const bb = caixaDosBairros(estado.bairros);
  const m = 3500;
  t.x = clamp(t.x, bb.minX - m, bb.maxX + m);
  t.z = clamp(t.z, bb.minZ - m, bb.maxZ + m);
  t.y = 0;
}
function ajustarCameraENevoa() {
  const cam = cena.camera;
  const d = cam.position.distanceTo(cena.controles.target);
  const perto = clamp(d * 0.004, 0.25, 40);
  if (Math.abs(cam.near - perto) / perto > 0.15) { cam.near = perto; cam.updateProjectionMatrix(); }
  cena.nevoa.near = Math.max(2400, d * 1.1);
  cena.nevoa.far = cena.nevoa.near + Math.max(9000, d * 2.4);
}
function atualizarBussola() {
  const t = cena.controles.target;
  const a = new THREE.Vector3(t.x, 0, t.z).project(cena.camera);
  const b = new THREE.Vector3(t.x, 0, t.z - 200).project(cena.camera);
  const ang = Math.atan2(b.x - a.x, b.y - a.y);
  const ag = $('#agulhaBussola');
  if (ag) ag.style.transform = 'rotate(' + (ang * 180 / Math.PI).toFixed(1) + 'deg)';
}

/* ---------- Rótulos e pinos (DOM sobre o canvas) ---------- */
function montarRotulos() {
  const caixaRot = $('#rotulos');
  caixaRot.innerHTML = '';
  cena.pinos = []; cena.rotulosBairro = []; cena.rotulosLocais = [];
  for (const b of estado.bairros) {
    const el = document.createElement('div');
    el.className = 'rot-bairro';
    el.textContent = b.nome;
    el.hidden = true;
    caixaRot.appendChild(el);
    cena.rotulosBairro.push({ el, x: b.rx, z: b.rz, area: b.area, larg: b.nome.length * 7.4 + 8, b });
  }
  if (estado.modelo && estado.camadas.locais) {
    for (const p of estado.modelo.pois) {
      if (p.saude || !p.nome) continue;
      const el = document.createElement('div');
      el.className = 'rot-local';
      el.textContent = p.nome;
      el.hidden = true;
      caixaRot.appendChild(el);
      cena.rotulosLocais.push({ el, x: p.x, z: p.z, larg: p.nome.length * 6.4 + 10 });
    }
  }
  for (const u of itensNoMapa()) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'pino' + (u.aproximada ? ' aprox' : '') + (estado.selecao && estado.selecao.chave === u.chave ? ' sel' : '');
    el.style.setProperty('--cor', u.cor);
    el.setAttribute('aria-label', u.nome + (u.aproximada ? ' (posição aproximada)' : ''));
    el.innerHTML = '<span class="pino-chip"><span class="pino-ic">' + ic(u.icone) + '</span><span>' + esc(u.sigla) + '</span>' +
      (u.nomeCurto ? '<span class="pino-nome">' + esc(u.nomeCurto) + '</span>' : '') + '</span><span class="pino-haste"></span>';
    el.addEventListener('click', (ev) => { ev.stopPropagation(); selecionarItemMapa(u.chave, { voar: true }); });
    caixaRot.appendChild(el);
    cena.pinos.push({ el, x: u.x, z: u.z, chave: u.chave });
  }
  cena.precisaRender = true;
}
function atualizarRotulos() {
  const palco = $('#palco');
  const w = palco.clientWidth, h = palco.clientHeight;
  if (!w || !h) return;
  const cam = cena.camera;
  const d = cam.position.distanceTo(cena.controles.target);
  $('#rotulos').classList.toggle('perto', d < 1800);
  const v = new THREE.Vector3();
  const ocupados = [];
  const sobrepoe = (x0, y0, x1, y1) => ocupados.some(o => !(x1 < o[0] || x0 > o[2] || y1 < o[1] || y0 > o[3]));
  const e = cena.escalaMarc || 1;
  const mostrarPinos = estado.camadas.rede || estado.camadas.osmSaude;
  for (const p of cena.pinos) {
    if (!mostrarPinos) { p.el.hidden = true; continue; }
    v.set(p.x, ALTURA_HASTE * e + 7 * e, p.z).project(cam);
    const vis = v.z < 1 && v.x > -1.15 && v.x < 1.15 && v.y > -1.15 && v.y < 1.2;
    p.el.hidden = !vis;
    if (!vis) continue;
    const px = (v.x + 1) / 2 * w, py = (1 - v.y) / 2 * h;
    p.el.style.transform = 'translate(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px) translate(-50%,-100%)';
    ocupados.push([px - 40, py - 30, px + 40, py]);
  }
  const mostrarBairros = estado.camadas.nomesBairros;
  const ordem = cena.rotulosBairro.slice().sort((a, b) => (b.b === estado.bairroSel) - (a.b === estado.bairroSel) || b.area - a.area);
  for (const r of ordem) {
    if (!mostrarBairros) { r.el.hidden = true; continue; }
    v.set(r.x, 0, r.z).project(cam);
    const dist = cam.position.distanceTo(new THREE.Vector3(r.x, 0, r.z));
    const limite = 2600 + Math.sqrt(r.area) * 6;
    let vis = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05 && (dist < limite || r.b === estado.bairroSel);
    if (vis) {
      const px = (v.x + 1) / 2 * w, py = (1 - v.y) / 2 * h;
      const hw = r.larg / 2;
      if (r.b !== estado.bairroSel && sobrepoe(px - hw, py - 9, px + hw, py + 9)) vis = false;
      else {
        ocupados.push([px - hw, py - 9, px + hw, py + 9]);
        r.el.style.transform = 'translate(' + (px - hw).toFixed(1) + 'px,' + (py - 9).toFixed(1) + 'px)';
      }
    }
    r.el.hidden = !vis;
    r.el.classList.toggle('sel', r.b === estado.bairroSel);
  }
  for (const r of cena.rotulosLocais) {
    v.set(r.x, 0, r.z).project(cam);
    const dist = cam.position.distanceTo(new THREE.Vector3(r.x, 0, r.z));
    let vis = estado.camadas.locais && v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05 && dist < 2200;
    if (vis) {
      const px = (v.x + 1) / 2 * w, py = (1 - v.y) / 2 * h, hw = r.larg / 2;
      if (sobrepoe(px - hw, py - 8, px + hw, py + 8)) vis = false;
      else { ocupados.push([px - hw, py - 8, px + hw, py + 8]); r.el.style.transform = 'translate(' + (px - hw).toFixed(1) + 'px,' + (py - 8).toFixed(1) + 'px)'; }
    }
    r.el.hidden = !vis;
  }
}

/* ---------- Camadas ---------- */
function aplicarCamadas() {
  const c = estado.camadas, M = cena.malhas;
  if (M.solidos) M.solidos.visible = c.predios || c.arvores;
  if (M.janelas) M.janelas.visible = c.predios && c.janelas;
  if (M.vias) M.vias.visible = c.vias;
  if (M.calcadas) M.calcadas.visible = c.vias;
  if (M.trilhos) M.trilhos.visible = c.vias;
  if (cena.limites) cena.limites.visible = c.limites;
  if (cena.marcadores) cena.marcadores.visible = c.rede || c.osmSaude;
  if (cena.aneis) cena.aneis.visible = c.rede;
  /* Prédios e árvores dividem a mesma malha: ocultar um deles zera a escala das instâncias correspondentes. */
  aplicarVisibilidadeSolidos();
  cena.precisaRender = true;
}
function aplicarVisibilidadeSolidos() {
  const M = cena.malhas.solidos, cid = estado.cidade;
  if (!M || !cid) return;
  const c = estado.camadas;
  const chave = (c.predios ? 1 : 0) + (c.arvores ? 2 : 0);
  if (cena.visSolidos === chave) return;
  cena.visSolidos = chave;
  const orig = cid.solidos.m, arr = M.instanceMatrix.array, dono = cid.dono;
  for (let i = 0; i < cid.solidos.n; i++) {
    const ehArvore = dono[i] === -2;
    const mostra = ehArvore ? c.arvores : c.predios;
    const o = i * 16;
    if (mostra) { for (let k = 0; k < 16; k++) arr[o + k] = orig[o + k]; }
    else { for (let k = 0; k < 15; k++) arr[o + k] = 0; arr[o + 15] = 1; }
  }
  M.instanceMatrix.needsUpdate = true;
}

/* ---------- Clique no mapa ---------- */
function pontoNoChao(ev) {
  const cv = cena.renderer.domElement;
  const rc = cv.getBoundingClientRect();
  const nd = new THREE.Vector2(((ev.clientX - rc.left) / rc.width) * 2 - 1, -((ev.clientY - rc.top) / rc.height) * 2 + 1);
  cena.raycaster.setFromCamera(nd, cena.camera);
  return nd;
}
function intersecaoChao() {
  const plano = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const p = new THREE.Vector3();
  return cena.raycaster.ray.intersectPlane(plano, p) ? p : null;
}
function aoClicarMapa(ev) {
  pontoNoChao(ev);
  if (estado.posicionando) {
    const p = intersecaoChao();
    if (p) confirmarPosicaoUnidade(p.x, p.z);
    return;
  }
  if (cena.marcadores && cena.marcadores.visible) {
    const hits = cena.raycaster.intersectObjects(cena.marcadores.children, false);
    if (hits.length && hits[0].object.userData.item) { selecionarItemMapa(hits[0].object.userData.item, { voar: true }); return; }
  }
  const M = cena.malhas.solidos;
  if (M && M.visible && estado.camadas.predios) {
    const hits = cena.raycaster.intersectObject(M, false);
    for (const h of hits) {
      const dono = estado.cidade.dono[h.instanceId];
      if (dono >= 0) { selecionarPredio(dono); return; }
      if (dono === -2) break;
    }
  }
  const p = intersecaoChao();
  if (!p) return;
  const b = bairroNoPonto(estado.bairros, p.x, p.z);
  if (b) selecionarBairro(b.i, { voar: false });
  else selecionarPonto(p.x, p.z);
}

/* ---------- Laço de desenho (desenha só quando algo muda) ---------- */
function laco(agora) {
  requestAnimationFrame(laco);
  if (!cena.pronta || document.hidden) return;
  const dt = Math.min(0.1, (agora - (cena.ultimo || agora)) / 1000);
  cena.ultimo = agora;
  if (cena.redimensionar) { cena.redimensionar = false; redimensionarCena(); }
  if (cena.voo) { atualizarVoo(agora); cena.precisaRender = true; }
  if (estado.cfg.animarDia) {
    estado.cfg.hora = (estado.cfg.hora + dt * estado.cfg.velocidadeDia / 60 + 24) % 24;
    if (agora - cena.ultimaLuz > 90) { cena.ultimaLuz = agora; aplicarLuz(); }
  }
  if (cena.controles.update()) cena.precisaRender = true;
  if (!cena.precisaRender) return;
  cena.precisaRender = false;
  limitarAlvo();
  ajustarCameraENevoa();
  ajustarEscalaMarcadores(false);
  posicionarSol();
  atualizarBussola();
  cena.renderer.render(cena.scene, cena.camera);
  cena.quadros++;
  atualizarRotulos();
}
function redimensionarCena() {
  const palco = $('#palco');
  const w = palco.clientWidth, h = palco.clientHeight;
  if (!w || !h) return;
  cena.renderer.setSize(w, h, false);
  cena.camera.aspect = w / h;
  cena.camera.updateProjectionMatrix();
  cena.precisaRender = true;
}

/* ---------- Imagem da vista (PNG com rodapé em Arial) ---------- */
function baixarImagem() {
  if (!cena.pronta) return;
  try {
    cena.renderer.render(cena.scene, cena.camera);
    const src = cena.renderer.domElement;
    const w = src.width, h = src.height;
    const escala = w / Math.max(1, $('#palco').clientWidth);
    const faixa = Math.round(Math.max(64, h * 0.075));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h + faixa;
    const g = cv.getContext('2d');
    g.drawImage(src, 0, 0);
    /* Pinos visíveis das unidades */
    g.font = '700 ' + Math.round(11 * escala) + 'px Arial, Helvetica, sans-serif';
    g.textBaseline = 'middle';
    for (const p of cena.pinos) {
      if (p.el.hidden) continue;
      const m = /translate\(([-\d.]+)px,([-\d.]+)px\)/.exec(p.el.style.transform || '');
      if (!m) continue;
      const x = parseFloat(m[1]) * escala, y = parseFloat(m[2]) * escala;
      const u = itemPorChave(p.chave);
      if (!u) continue;
      const tw = g.measureText(u.sigla).width + 16 * escala, th = 20 * escala;
      g.fillStyle = 'rgba(255,255,255,0.95)';
      g.strokeStyle = u.cor; g.lineWidth = 2 * escala;
      const x0 = x - tw / 2, y0 = y - th - 10 * escala;
      g.beginPath();
      if (g.roundRect) g.roundRect(x0, y0, tw, th, th / 2); else g.rect(x0, y0, tw, th);
      g.fill(); g.stroke();
      g.fillStyle = '#13233A';
      g.fillText(u.sigla, x0 + 8 * escala, y0 + th / 2);
      g.fillStyle = u.cor;
      g.fillRect(x - escala, y0 + th, 2 * escala, 10 * escala);
    }
    /* Rodapé com faixa APS e data de emissão */
    g.fillStyle = '#ffffff';
    g.fillRect(0, h, w, faixa);
    const cores = ['#56B8BE', '#4DAA57', '#F2B632', '#ED713B', '#D61D5C'];
    cores.forEach((c, i) => { g.fillStyle = c; g.fillRect(i * w / 5, h, w / 5 + 1, Math.max(3, Math.round(4 * escala))); });
    const fs = Math.round(faixa * 0.24);
    g.fillStyle = '#13233A';
    g.font = '700 ' + fs + 'px Arial, Helvetica, sans-serif';
    g.textBaseline = 'alphabetic';
    g.fillText('Cruz Alta 3D · APS Cruz Alta · Secretaria Municipal de Saúde de Cruz Alta (RS)', fs, h + faixa * 0.46);
    g.font = '400 ' + Math.round(fs * 0.82) + 'px Arial, Helvetica, sans-serif';
    g.fillStyle = '#42536A';
    const fonte = estado.fonte === 'osm' ? 'Ruas e prédios: © colaboradores do OpenStreetMap (ODbL)' : 'Traçado ilustrativo gerado por algoritmo';
    g.fillText(fonte + ' · Bairros: IBGE, Censo 2022 · Hora simulada ' + fmtHora(estado.cfg.hora), fs, h + faixa * 0.78);
    const emissao = 'Emitido em ' + fmtDataHora(new Date());
    g.textAlign = 'right';
    g.fillText(emissao, w - fs, h + faixa * 0.78);
    g.textAlign = 'left';
    cv.toBlob((blob) => {
      if (!blob) { toast('erro', 'Não foi possível gerar a imagem', 'O navegador bloqueou a captura do mapa.'); return; }
      const nome = 'cruzalta-3d-' + carimboArquivo() + '.png';
      const url = URL.createObjectURL(blob);
      try { baixarBlob(blob, nome); } catch (e) { /* segue com a prévia */ }
      const m = abrirModal('<h2>' + ic('imagem') + ' Imagem da vista</h2><p>O download começou. Se o navegador bloquear, use o botão abaixo ou clique com o botão direito na imagem e escolha salvar.</p>' +
        '<img class="previa" alt="Prévia da imagem exportada" src="' + url + '">' +
        '<div class="acoes"><a class="btn prim" href="' + url + '" download="' + nome + '">' + ic('baixar') + ' Salvar imagem</a><button class="btn" type="button" data-f>Fechar</button></div>',
        { larga: true, aoFechar: () => setTimeout(() => URL.revokeObjectURL(url), 30000) });
      m.el.querySelector('[data-f]').addEventListener('click', () => m.fechar());
    }, 'image/png');
  } catch (e) {
    console.error(e);
    toast('erro', 'Falha ao exportar a imagem', e.message);
  }
}

function ligarRedimensionador(el, lado) {
  let ini = null;
  const trilho = () => (lado === 'esq' ? 64 : 54);
  const recolhido = () => $('#app').classList.contains(lado === 'esq' ? 'esq-off' : 'dir-off');
  const definir = (px) => {
    const lim = LIMITES_PAINEL[lado];
    const maxCentro = window.innerWidth - (lado === 'esq' ? estado.ui.rw : estado.ui.lw) - 320;
    const v = Math.round(clamp(px, lim[0], Math.max(lim[0], Math.min(lim[1], maxCentro))));
    if (lado === 'esq') estado.ui.lw = v; else estado.ui.rw = v;
    aplicarLarguras();
  };
  el.addEventListener('pointerdown', (ev) => {
    if (modoTela() !== 'desktop' || ev.button !== 0) return;
    ev.preventDefault();
    try { el.setPointerCapture(ev.pointerId); } catch (e) { /* sem captura */ }
    ini = { x: ev.clientX, larg: recolhido() ? trilho() : (lado === 'esq' ? estado.ui.lw : estado.ui.rw), off: recolhido(), moveu: false };
    el.classList.add('ativo');
    $('#app').classList.add('redimensionando');
  });
  el.addEventListener('pointermove', (ev) => {
    if (!ini) return;
    const dx = (ev.clientX - ini.x) * (lado === 'esq' ? 1 : -1);
    if (Math.abs(dx) > 3) ini.moveu = true;
    if (ini.off) {
      if (dx <= 24) return;
      ini.off = false;
      if (lado === 'esq') { $('#app').classList.remove('esq-off'); estado.ui.esqOff = false; }
      else { $('#app').classList.remove('dir-off'); estado.ui.dirOff = false; }
    }
    definir(ini.larg + dx);
    cena.redimensionar = true;
  });
  const soltar = (ev) => {
    if (!ini) return;
    try { el.releasePointerCapture(ev.pointerId); } catch (e) { /* já liberado */ }
    if (!ini.moveu && ini.off) { if (lado === 'esq') alternarEsq(true); else alternarDir(true); }
    el.classList.remove('ativo');
    $('#app').classList.remove('redimensionando');
    ini = null;
    salvarUI();
    cena.redimensionar = true;
  };
  el.addEventListener('pointerup', soltar);
  el.addEventListener('pointercancel', soltar);
  el.addEventListener('dblclick', () => {
    definir(lado === 'esq' ? UI_PADRAO.lw : UI_PADRAO.rw);
    if (lado === 'esq') alternarEsq(true); else alternarDir(true);
    salvarUI();
  });
}

/* ---------- Rede de saúde ---------- */
function tipoInfo(tipo) { return TIPOS_UNIDADE[tipo] || TIPOS_UNIDADE.Outro; }
function filtroAtual() { return FILTROS_REDE.find(f => f.id === estado.ui.filtroRede) || FILTROS_REDE[0]; }
function filtroAceita(tipo) { const f = filtroAtual(); return !f.tipos || f.tipos.indexOf(tipo) >= 0; }
function nomeCurto(u) { const p = String(u.nome || '').split('·'); return (p.length > 1 ? p.slice(1).join('·') : p[0]).trim(); }
function unidadePorId(id) { return estado.unidades.find(u => u.id === id) || null; }
function siglaPOI(p) {
  const t = p.tg.amenity || p.tg.healthcare || '';
  return t === 'pharmacy' ? 'FARMÁCIA' : (t === 'hospital' ? 'HOSPITAL' : (t === 'dentist' ? 'ODONTO' : 'SAÚDE'));
}
function itensNoMapa() {
  const lista = [];
  if (estado.camadas.rede) {
    for (const u of estado.unidades) {
      if (!u.pos || u.ativo === false || !filtroAceita(u.tipo)) continue;
      const t = tipoInfo(u.tipo);
      lista.push({ chave: 'u:' + u.id, x: u.pos.x, z: u.pos.z, cor: t.cor, icone: t.icone, sigla: u.sigla, nome: u.nome, nomeCurto: nomeCurto(u), aproximada: u.pos.fonte === 'bairro' });
    }
  }
  if (estado.camadas.osmSaude && estado.modelo && filtroAceita('OSM')) {
    for (const p of estado.modelo.pois) {
      if (!p.saude || p.unidadeId || !p.nome) continue;
      lista.push({ chave: 'p:' + p.id, x: p.x, z: p.z, cor: TIPOS_UNIDADE.OSM.cor, icone: 'mais-saude', sigla: siglaPOI(p), nome: p.nome, nomeCurto: p.nome, aproximada: false });
    }
  }
  return lista;
}
function itemPorChave(chave) {
  if (!chave) return null;
  if (chave.indexOf('u:') === 0) {
    const u = unidadePorId(chave.slice(2));
    if (!u) return null;
    const t = tipoInfo(u.tipo);
    return { chave, tipo: 'unidade', ref: u, x: u.pos ? u.pos.x : null, z: u.pos ? u.pos.z : null, cor: t.cor, sigla: u.sigla, nome: u.nome };
  }
  if (chave.indexOf('p:') === 0 && estado.modelo) {
    const p = estado.modelo.pois.find(x => x.id === chave.slice(2));
    if (!p) return null;
    return { chave, tipo: 'poi', ref: p, x: p.x, z: p.z, cor: TIPOS_UNIDADE.OSM.cor, sigla: siglaPOI(p), nome: p.nome };
  }
  return null;
}
function resolverPosicoes() {
  const locais = lerLocal(CHAVE_POS, {});
  estado.avisos = estado.avisos.filter(a => a.tipo !== 'coordenada');
  for (const u of estado.unidades) {
    u.pos = null;
    let fonte = null, lat = null, lon = null;
    const loc = locais[u.id];
    if (loc && isFinite(loc.lat) && isFinite(loc.lon)) { fonte = 'local'; lat = +loc.lat; lon = +loc.lon; }
    else if (u.lat !== null && u.lat !== undefined && u.lat !== '' && isFinite(u.lat) && isFinite(u.lon)) {
      if (Math.abs(u.lat - ORIGEM.lat) < 0.5 && Math.abs(u.lon - ORIGEM.lon) < 0.5) { fonte = 'planilha'; lat = +u.lat; lon = +u.lon; }
      else estado.avisos.push({ tipo: 'coordenada', texto: u.nome + ': coordenada fora de Cruz Alta na planilha (' + u.lat + ', ' + u.lon + ').' });
    }
    if (fonte) { const xz = paraXZ(lon, lat); u.pos = { x: xz[0], z: xz[1], fonte, lat, lon }; }
    else if (u.osm) { const ll = paraLonLat(u.osm.x, u.osm.z); u.pos = { x: u.osm.x, z: u.osm.z, fonte: 'osm', lat: ll[1], lon: ll[0] }; }
    else {
      const ref = referenciaBairro(u, estado.bairros);
      if (ref) { const ll = paraLonLat(ref[0], ref[1]); u.pos = { x: ref[0], z: ref[1], fonte: 'bairro', lat: ll[1], lon: ll[0], bairroRef: ref[2].nome }; }
    }
    if (u.pos) { const b = bairroNoPonto(estado.bairros, u.pos.x, u.pos.z); u.pos.bairro = b ? b.nome : ''; }
  }
}
const ROTULOS_POSICAO = {
  local: ['local', 'Ajustada neste navegador'], planilha: ['exata', 'Planilha da rede'], osm: ['exata', 'OpenStreetMap'], bairro: ['aprox', 'Aproximada (centro do bairro)']
};
function tagPosicao(u) {
  if (!u.pos) return '<span class="tag sem">Sem posição</span>';
  const r = ROTULOS_POSICAO[u.pos.fonte] || ['sem', ''];
  return '<span class="tag ' + r[0] + '">' + (r[0] === 'exata' ? 'Exata' : (r[0] === 'aprox' ? 'Aproximada' : 'Local')) + '</span>';
}
function contarPorFiltro() {
  const c = {};
  FILTROS_REDE.forEach(f => {
    if (f.id === 'osm') c[f.id] = estado.modelo ? estado.modelo.pois.filter(p => p.saude && !p.unidadeId && p.nome).length : 0;

function selecionarItemMapa(chave, opcoes) {

  if (!it) return;
  estado.selecao = { tipo: it.tipo, chave };
  const u = it.tipo === 'unidade' ? it.ref : null;
  const bNome = u && u.pos ? u.pos.bairro : null;
  estado.bairroSel = bNome ? bairroPorNome(estado.bairros, bNome) : null;
  destacarBairro(null);
  if (o.voar && it.x !== null) voarPara(it.x, it.z, o.dist || 900, { duracao: o.duracao || 1200 });
  renderSelecao();
  abrirAba('selecao', modoTela() === 'desktop');
  marcarSelecaoVisual();

function selecionarBairro(i, opcoes) {
  const o = opcoes || {};
  const b = estado.bairros[i];
  if (!b) return;
  estado.selecao = { tipo: 'bairro', chave: 'b:' + i };
  estado.bairroSel = b;
  destacarBairro(b);
  if (o.voar) {
    const raio = Math.max(b.bb.maxX - b.bb.minX, b.bb.maxZ - b.bb.minZ);
    voarPara((b.bb.minX + b.bb.maxX) / 2, (b.bb.minZ + b.bb.maxZ) / 2, clamp(raio * 1.5, 500, 9000), { duracao: 1200 });
  }
  renderSelecao();
  abrirAba('selecao', modoTela() === 'desktop');

function ligarAcoesSelecao(raiz) {

  $$('.item-lista[data-chave]', raiz).forEach(b => b.addEventListener('click', () => selecionarItemMapa(b.dataset.chave, { voar: true })));
  $$('[data-acao]', raiz).forEach(b => b.addEventListener('click', () => {
    const s = estado.selecao;
    const a = b.dataset.acao;
    if (a === 'limpar-selecao') { limparSelecao(); return; }
    if (a === 'ir-bairro') { selecionarBairro(+b.dataset.bairro, { voar: true }); return; }
    if (!s) return;
    if (a === 'centralizar') { const it = itemPorChave(s.chave); if (it && it.x !== null) voarPara(it.x, it.z, 700, { duracao: 1000 }); }
    else if (a === 'posicionar') iniciarPosicionamento(s.chave.slice(2));
    else if (a === 'limpar-local') {
      const locais = lerLocal(CHAVE_POS, {}); delete locais[s.chave.slice(2)]; gravarLocal(CHAVE_POS, locais);
      resolverPosicoes(); atualizarRede(); renderSelecao(); toast('info', 'Ajuste local desfeito', 'A posição voltou à fonte anterior.');
    } else if (a === 'copiar-resumo') { const u = unidadePorId(s.chave.slice(2)); if (u) copiarTexto(textoResumoUnidade(u), 'Resumo da unidade'); }
    else if (a === 'enquadrar-bairro' && estado.bairroSel) selecionarBairro(estado.bairroSel.i, { voar: true });
    else if (a === 'copiar-bairro' && estado.bairroSel) copiarTexto(estado.bairroSel.nome, 'Nome do bairro');
  }));
}

/* ---------- Definir posição de uma unidade clicando no mapa ---------- */
function iniciarPosicionamento(id) {
  const u = unidadePorId(id);
  if (!u) return;
  estado.posicionando = id;
  pararTour(true);
  $('#palco').classList.add('posicionando');
  $('#bannerPosicionarTxt').innerHTML = 'Clique no mapa onde fica <b>' + esc(u.nome) + '</b>. Aproxime até ver a quadra. Esc cancela.';
  $('#bannerPosicionar').hidden = false;
  fecharGavetas();
  if (u.pos) voarPara(u.pos.x, u.pos.z, 650, { duracao: 900, polar: 0.35 });
  focar($('#palco'));
}
function cancelarPosicionamento() {
  estado.posicionando = null;
  $('#palco').classList.remove('posicionando');
  $('#bannerPosicionar').hidden = true;
}
async function confirmarPosicaoUnidade(x, z) {
  const u = unidadePorId(estado.posicionando);
  if (!u) { cancelarPosicionamento(); return; }
  const ll = paraLonLat(x, z);
  const lat = arred(ll[1], 6), lon = arred(ll[0], 6);
  const b = bairroNoPonto(estado.bairros, x, z);
  const ok = await confirmar('Salvar a posição?',
    esc(u.nome) + ' ficará em <b>' + fmtCoord(lat) + ', ' + fmtCoord(lon) + '</b>' + (b ? ', bairro <b>' + esc(b.nome) + '</b>' : ', fora dos bairros do IBGE') + '. ' +
    (temGAS() ? 'Em seguida será pedido o PIN para gravar na planilha.' : 'A posição fica salva neste navegador; em Dados você exporta a lista para a planilha.'),
    'Salvar posição', 'Escolher outro ponto');
  if (!ok) return;
  const locais = lerLocal(CHAVE_POS, {});
  locais[u.id] = { lat, lon, em: new Date().toISOString() };
  if (!gravarLocal(CHAVE_POS, locais)) toast('alerta', 'O navegador não permitiu salvar localmente', 'A posição vale só até fechar a página.');
  cancelarPosicionamento();
  resolverPosicoes();
  atualizarRede();
  renderListaBairros();
  selecionarItemMapa('u:' + u.id, { voar: false });
  marcarSalvo('Posição salva às ' + fmtHoraCurta(new Date()));
  toast('ok', 'Posição salva neste navegador', u.nome + ' · ' + fmtCoord(lat) + ', ' + fmtCoord(lon));
  if (temGAS()) {
    const pin = await pedirPin('Para gravar a posição de ' + u.nome + ' na planilha da rede, informe o PIN de edição.');
    if (!pin) return;
    try {
      const r = await gs('salvarPosicaoUnidade', u.id, lat, lon, pin);
      u.lat = lat; u.lon = lon;
      const loc2 = lerLocal(CHAVE_POS, {}); delete loc2[u.id]; gravarLocal(CHAVE_POS, loc2);
      resolverPosicoes(); atualizarRede(); renderSelecao();
      marcarSalvo('Planilha atualizada às ' + fmtHoraCurta(r && r.atualizadoEm ? r.atualizadoEm : new Date()));
      toast('ok', 'Posição gravada na planilha', u.nome + ' · ' + fmtDataHora(r && r.atualizadoEm ? r.atualizadoEm : new Date()));
    } catch (e) {
      toast('erro', 'A planilha não foi atualizada', e.message + ' A posição continua salva neste navegador.');
    }
  }
}

/* ---------- Busca (atalho /) ---------- */
function montarIndiceBusca() {
  const idx = [];
  for (const u of estado.unidades) {
    if (u.ativo === false) continue;
    idx.push({ tipo: 'unidade', icone: tipoInfo(u.tipo).icone, cor: tipoInfo(u.tipo).cor, rotulo: u.nome, sub: (u.pos ? (u.pos.bairro || 'Fora dos bairros') : 'Sem posição') + ' · ' + tipoInfo(u.tipo).rotulo,
      texto: normalizar(u.nome + ' ' + u.sigla + ' ' + (u.bairros || []).join(' ') + ' ' + (u.endereco || '')), chave: 'u:' + u.id, prio: 0 });
  }
  for (const b of estado.bairros) idx.push({ tipo: 'bairro', icone: 'mapa', rotulo: b.nome, sub: 'Bairro · ' + fmtArea(b.area), texto: 'bairro ' + b.chave, bairro: b.i, prio: 1 });
  if (estado.modelo) {
    const ruas = new Map();
    for (const r of estado.modelo.ruas) {
      if (!r.nome) continue;
      const k = normalizar(r.nome);
      let e = ruas.get(k);
      if (!e) { e = { nome: r.nome, sx: 0, sz: 0, n: 0, minX: Infinity, minZ: Infinity, maxX: -Infinity, maxZ: -Infinity }; ruas.set(k, e); }
      for (let i = 0; i < r.p.length; i += 2) {
        e.sx += r.p[i]; e.sz += r.p[i + 1]; e.n++;
        e.minX = Math.min(e.minX, r.p[i]); e.maxX = Math.max(e.maxX, r.p[i]); e.minZ = Math.min(e.minZ, r.p[i + 1]); e.maxZ = Math.max(e.maxZ, r.p[i + 1]);
      }
    }
    for (const [k, e] of ruas) idx.push({ tipo: 'rua', icone: 'rota', rotulo: e.nome, sub: 'Via · ' + fmtMetros(Math.max(e.maxX - e.minX, e.maxZ - e.minZ)), texto: k, x: e.sx / e.n, z: e.sz / e.n, extensao: Math.max(e.maxX - e.minX, e.maxZ - e.minZ), prio: 2 });
    for (const p of estado.modelo.pois) {
      if (!p.nome) continue;
      idx.push({ tipo: p.saude ? 'poi' : 'local', icone: p.saude ? 'mais-saude' : 'pino', rotulo: p.nome, sub: p.rotuloTipo + ' · OSM', texto: normalizar(p.nome + ' ' + p.rotuloTipo), x: p.x, z: p.z, chave: p.saude && !p.unidadeId ? 'p:' + p.id : null, prio: 3 });
    }
  }
  estado.indiceBusca = idx;
}
function buscar(termo) {
  const t = normalizar(termo);
  if (!t) return [];
  const partes = t.split(' ');
  const res = [];
  for (const it of estado.indiceBusca) {
    if (!partes.every(p => it.texto.indexOf(p) >= 0)) continue;
    const inicio = it.texto.indexOf(t) === 0 || normalizar(it.rotulo).indexOf(t) === 0 ? 0 : 1;
    res.push({ it, nota: inicio * 10 + it.prio });
  }
  res.sort((a, b) => a.nota - b.nota || a.it.rotulo.localeCompare(b.it.rotulo, 'pt-BR'));
  return res.slice(0, 14).map(r => r.it);
}
let resultadoAtivo = -1;
function mostrarResultados() {
  const caixa = $('#resultadosBusca');
  const termo = $('#campoBusca').value;
  if (!termo.trim()) { caixa.hidden = true; return; }
  const lista = buscar(termo);

    '<span><span class="res-tit">' + esc(it.rotulo) + '</span><br><span class="res-sub">' + esc(it.sub) + '</span></span></button>').join('')
    : '<div class="res-vazio">Nada encontrado para "' + esc(termo) + '". Tente o nome do bairro, da ESF ou da rua.</div>';

function escolherResultado(it) {
  if (!it) return;
  $('#resultadosBusca').hidden = true;

  if (it.chave) selecionarItemMapa(it.chave, { voar: true });
  else if (it.bairro !== undefined) selecionarBairro(it.bairro, { voar: true });
  else if (it.x !== undefined) {
    voarPara(it.x, it.z, it.tipo === 'rua' ? clamp(it.extensao * 1.3, 500, 6000) : 600, { duracao: 1200 });
    toast('info', it.rotulo, it.sub, 3000);

/* ---------- Ajustes (formulário gerado a partir de GRUPOS_AJUSTES) ---------- */
function specPorChave(k) {
  for (const g of GRUPOS_AJUSTES) for (const it of g.itens) if (it.k === k) return it;
  return null;
}
function sanearConfig(c) {
  const out = Object.assign({}, CONFIG_PADRAO);
  for (const k of Object.keys(CONFIG_PADRAO)) {
    if (c[k] === undefined || c[k] === null || c[k] === '') continue;
    const pad = CONFIG_PADRAO[k];
    const sp = specPorChave(k);
    if (typeof pad === 'boolean') out[k] = c[k] === true || c[k] === 'true' || c[k] === 1 || c[k] === '1';
    else if (typeof pad === 'number') {
      const v = parseFloat(String(c[k]).replace(',', '.'));
      if (!isFinite(v)) continue;
      out[k] = sp && sp.min !== undefined ? clamp(v, sp.min, sp.max) : v;
      if (k === 'semente') out[k] = Math.floor(Math.abs(v)) % 2147483647;
    } else if (k === 'data') out[k] = /^\d{4}-\d{2}-\d{2}$/.test(String(c[k])) ? String(c[k]) : '';
    else if (k === 'navegacao') out[k] = c[k] === 'orbita' ? 'orbita' : 'mapa';
    else if (k === 'qualidade') out[k] = ['auto', 'baixa', 'media', 'alta'].indexOf(c[k]) >= 0 ? c[k] : 'auto';
    else out[k] = String(c[k]);
  }
  return out;
}
function qualidadeAtual() {
  let q = estado.cfg.qualidade;
  if (q === 'auto') {
    const mem = navigator.deviceMemory || 4, nucleos = navigator.hardwareConcurrency || 4;
    const toque = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    q = toque && (mem <= 4 || nucleos <= 6) ? 'baixa' : (!toque && mem >= 8 && nucleos >= 8 ? 'alta' : 'media');
  }
  estado.qualidadeEfetiva = q;
  return QUALIDADES[q];
}
function valorTexto(sp, v) {
  if (sp.fmt === 'hora') return fmtHora(v);
  return String(arred(v, sp.passo < 0.1 ? 2 : (sp.passo < 1 ? 1 : 0)));
}

const regenerarAtrasado = debounce(() => reconstruirCidade({}), 350);
function aplicarMudancaAjuste(k, valor) {
  const sp = specPorChave(k);
  const antes = estado.cfg[k];
  estado.cfg = sanearConfig(Object.assign({}, estado.cfg, { [k]: valor }));
  salvarCfgLocal();
  if (antes === estado.cfg[k] && k !== 'data') return;
  if (k === 'qualidade') { aplicarQualidade(); return; }
  if (sp && sp.vivo) {
    if (k === 'hora' || k === 'data' || k === 'chanceAcesas' || k === 'sombras') aplicarLuz();
    if (k === 'exageroVertical') aplicarExagero();
    if (k === 'animarDia') atualizarHoraUI();
    return;
  }
  if (k === 'coresPorBairro') { regenerarAtrasado(); return; }
  regenerarAtrasado();
}
function ligarAjustes() {
  const raiz = $('#abaAjustes');
  $$('input[type=range][data-k]', raiz).forEach(inp => {
    const k = inp.dataset.k, sp = specPorChave(k), num = $('#ajn-' + k);
    inp.addEventListener('input', () => {
      num.value = valorTexto(sp, parseFloat(inp.value));
      if (sp.vivo) aplicarMudancaAjuste(k, parseFloat(inp.value));
    });
    inp.addEventListener('change', () => aplicarMudancaAjuste(k, parseFloat(inp.value)));
  });
  $$('input[data-kn]', raiz).forEach(num => {
    const k = num.dataset.kn, sp = specPorChave(k);
    num.addEventListener('change', () => {
      let v;
      if (sp.fmt === 'hora') { const m = /^(\d{1,2})(?::(\d{1,2}))?$/.exec(num.value.trim()); v = m ? (+m[1]) + (m[2] ? (+m[2]) / 60 : 0) : estado.cfg[k]; }
      else v = parseFloat(String(num.value).replace(',', '.'));
      if (!isFinite(v)) v = estado.cfg[k];
      v = clamp(v, sp.min, sp.max);
      $('#aj-' + k).value = String(v);
      num.value = valorTexto(sp, v);
      aplicarMudancaAjuste(k, v);
    });
  });
  $$('input[type=checkbox][data-k]', raiz).forEach(inp => inp.addEventListener('change', () => aplicarMudancaAjuste(inp.dataset.k, inp.checked)));
  $$('input[type=date][data-k], select[data-k]', raiz).forEach(inp => inp.addEventListener('change', () => aplicarMudancaAjuste(inp.dataset.k, inp.value)));
  $('#aj-coresPorBairro').addEventListener('change', (ev) => { aplicarMudancaAjuste('coresPorBairro', ev.target.checked); if (cena.pronta) montarChao(pintarChao({ bairros: estado.bairros, fonte: estado.fonte, modelo: estado.modelo, ctx: estado.ctxGeracao }, estado.cfg, qualidadeAtual())); });
  $('#aj-semente').addEventListener('change', (ev) => aplicarMudancaAjuste('semente', ev.target.value));
  $('#btnSementeAleatoria').addEventListener('click', () => {
    const v = Math.floor(aleatorioSeguro() * 1000000);
    $('#aj-semente').value = String(v);
    aplicarMudancaAjuste('semente', v);
  });
  $$('#segNavegacao button').forEach(b => b.addEventListener('click', () => {
    $$('#segNavegacao button').forEach(x => x.classList.toggle('ativo', x === b));
    estado.cfg.navegacao = b.dataset.v; salvarCfgLocal(); aplicarModoNavegacao(estado.cfg.navegacao);
  }));
  $('#btnAjRedefinirVista').addEventListener('click', () => vistaCidadeInteira(true));
  $('#btnAjRestaurar').addEventListener('click', async () => {
    if (!(await confirmar('Restaurar os ajustes padrão?', 'A cidade será gerada de novo com os valores originais. As posições das unidades não mudam.', 'Restaurar'))) return;
    estado.cfg = sanearConfig(Object.assign({}, CONFIG_PADRAO, estado.gas.config || {}));
    salvarCfgLocal(); montarAjustesUI(); aplicarModoNavegacao(estado.cfg.navegacao); aplicarLuz(); reconstruirCidade({});
  });
  const bp = $('#btnAjPadraoSistema');
  if (bp) bp.addEventListener('click', async () => {
    const pin = await pedirPin('Os ajustes atuais passarão a ser o padrão para todos que abrirem o mapa pela primeira vez.');
    if (!pin) return;
    try {
      const cfgSalvar = Object.assign({}, estado.cfg, { animarDia: false });
      const r = await gs('salvarConfiguracaoPadrao', JSON.stringify(cfgSalvar), pin);
      estado.gas.config = cfgSalvar;
      marcarSalvo('Padrão do sistema salvo às ' + fmtHoraCurta(r && r.atualizadoEm ? r.atualizadoEm : new Date()));
      toast('ok', 'Padrão do sistema atualizado', 'Salvo na planilha em ' + fmtDataHora(r && r.atualizadoEm ? r.atualizadoEm : new Date()) + '.');
    } catch (e) { toast('erro', 'Não foi possível salvar o padrão', e.message); }
  });
}
function salvarCfgLocal() {
  const c = Object.assign({}, estado.cfg, { animarDia: false });
  if (gravarLocal(CHAVE_CFG, { cfg: c, em: new Date().toISOString() })) marcarSalvo('Ajustes salvos às ' + fmtHoraCurta(new Date()));

function aplicarQualidade() {
  const q = qualidadeAtual();
  if (cena.pronta) {
    cena.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, q.razaoPixel));
    cena.sol.shadow.mapSize.set(q.sombra, q.sombra);
    if (cena.sol.shadow.map) { cena.sol.shadow.map.dispose(); cena.sol.shadow.map = null; }
    cena.redimensionar = true;
  }
  reconstruirCidade({});
}

   DADOS, GERAÇÃO E ARRANQUE

function montarUnidades(daPlanilha) {
  const nova = (u) => Object.assign({ sigla: '', nome: '', tipo: 'Outro', bairros: [], chaves: [], imagem: '', ativo: true, lat: null, lon: null,
    endereco: '', telefone: '', obs: '', osm: null, pos: null }, u);
  const base = UNIDADES_PADRAO.map(u => nova(Object.assign({}, u, { bairros: u.bairros.slice(), chaves: u.chaves.slice(), imagem: u.imagem ? REPO_RAW + u.imagem : '' })));
  if (Array.isArray(daPlanilha)) {
    for (const p of daPlanilha) {
      if (!p || !p.id) continue;
      const id = String(p.id).trim();
      let u = base.find(x => x.id === id);
      if (!u) { u = nova({ id }); base.push(u); }
      if (p.sigla) u.sigla = String(p.sigla).trim();
      if (p.nome) u.nome = String(p.nome).trim();
      if (p.tipo && TIPOS_UNIDADE[p.tipo]) u.tipo = p.tipo;
      if (p.bairro && String(p.bairro).trim() && p.bairro !== 'Não informado') u.bairros = [String(p.bairro).trim()];
      if (p.endereco) u.endereco = String(p.endereco).trim();
      if (p.telefone) u.telefone = String(p.telefone).trim();
      if (p.obs) u.obs = String(p.obs).trim();
      if (p.imagem) u.imagem = /^https?:\/\//i.test(p.imagem) ? String(p.imagem).trim() : REPO_RAW + String(p.imagem).trim().replace(/^\/+/, '');
      const lat = parseFloat(String(p.lat === undefined ? '' : p.lat).replace(',', '.'));
      const lon = parseFloat(String(p.lon === undefined ? '' : p.lon).replace(',', '.'));
      if (isFinite(lat) && isFinite(lon)) { u.lat = lat; u.lon = lon; } else { u.lat = null; u.lon = null; }
      const at = String(p.ativo === undefined ? 'Sim' : p.ativo).toLowerCase();
      u.ativo = !(p.ativo === false || at === 'não' || at === 'nao' || at === 'false');
      if (!u.nome) u.nome = u.sigla || id;
      if (!u.sigla) u.sigla = u.nome.split(' ').slice(0, 2).join(' ');
    }
  }
  return base;
}
function aplicarContextoGAS(r) {
  if (!r) return;
  estado.gas.disponivel = true;
  estado.gas.planilhaUrl = r.planilhaUrl || '';
  estado.gas.edicao = !!r.edicao;
  estado.gas.unidades = Array.isArray(r.unidades) ? r.unidades : null;
  estado.gas.cache = r.cache || null;
  estado.gas.config = null;
  if (r.config) {
    try { estado.gas.config = typeof r.config === 'string' ? JSON.parse(r.config) : r.config; } catch (e) { estado.gas.config = null; }
  }
}
function montarConfig() {
  const salvo = lerLocal(CHAVE_CFG, null);
  let c = Object.assign({}, CONFIG_PADRAO, estado.gas.config || {});
  if (salvo && salvo.cfg) c = Object.assign(c, salvo.cfg);
  const p = estado.params || {};
  if (p.hora !== undefined && p.hora !== '') c.hora = p.hora;
  if (p.semente !== undefined && p.semente !== '') c.semente = p.semente;
  if (p.navegacao) c.navegacao = p.navegacao;
  if (p.data) c.data = p.data;
  c.animarDia = p.animar === '1';
  if (salvo && salvo.em) marcarSalvo('Ajustes de ' + fmtDataHora(salvo.em));
  return sanearConfig(c);
}
function prepararContexto() {
  const bCentro = bairroPorNome(estado.bairros, 'Centro') || estado.bairros[0];
  let centro = [bCentro.rx, bCentro.rz];
  if (estado.modelo && estado.modelo.centro) {
    const c = estado.modelo.centro;
    if (bairroNoPonto(estado.bairros, c[0], c[1])) centro = [c[0], c[1]];
  }
  const areaTotal = estado.bairros.reduce((s, b) => s + b.area, 0);
  Object.assign(estado.ctxGeracao, { centro, bairroCentro: bCentro, raioUrbano: Math.sqrt(areaTotal / Math.PI) });
}

async function reconstruirCidade(opcoes) {
  const o = opcoes || {};
  if (estado.gerando) { estado.regerarPendente = true; return; }
  estado.gerando = true;
  try {
    const qual = qualidadeAtual();
    const entrada = { bairros: estado.bairros, fonte: estado.fonte, modelo: estado.modelo, ctx: estado.ctxGeracao };
    const prog = o.inicial
      ? (f, msg) => carga.progresso(f, msg || '')
      : (f, msg) => mostrarTarefa((msg || 'Gerando a cidade') + ' · ' + Math.round(f * 100) + '%', f, false);
    if (!o.inicial) mostrarTarefa('Gerando a cidade · 0%', 0, false);
    const cid = await gerarCidade(entrada, estado.cfg, qual, prog);
    estado.cidade = cid;
    cena.visSolidos = -1;
    if (estado.selecao && estado.selecao.tipo === 'predio') { estado.selecao = null; estado.bairroSel = null; }
    montarMalhasCidade(cid);
    montarChao(pintarChao(entrada, estado.cfg, qual));
    renderDados();
    renderSelecao();
    marcarSelecaoVisual();
    console.info('[Cruz Alta 3D] Cidade gerada', cid.stats);
  } catch (e) {
    console.error('[Cruz Alta 3D] Falha na geração', e);
    toast('erro', 'Não foi possível gerar a cidade', (e && e.message) || String(e));
    if (o.inicial) throw e;
  } finally {
    estado.gerando = false;
    if (!o.inicial) ocultarTarefa();
    if (estado.regerarPendente) { estado.regerarPendente = false; setTimeout(() => reconstruirCidade({}), 0); }
  }
}

/* ---------- Cadeia de dados: cópia local, servidor, repositório, Overpass, ilustrativo ---------- */
async function descomprimirBase64Gzip(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  if (typeof DecompressionStream === 'undefined') throw new Error('Este navegador não descompacta dados (atualize o navegador).');
  const fluxo = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(fluxo).text();
}
async function salvarCacheLocal(dados) {
  try { await banco.gravar(IDB_CHAVE, { salvoEm: new Date().toISOString(), dados }); return true; }
  catch (e) { console.warn('[Cruz Alta 3D] Cache local indisponível', e); return false; }
}
async function obterDadosIniciais() {
  try {
    const c = await banco.ler(IDB_CHAVE);
    if (c && c.dados && Array.isArray(c.dados.el) && c.dados.el.length) return { dados: c.dados, origem: 'cache-local', data: c.dados.geradoEm || c.salvoEm };
  } catch (e) { console.warn('[Cruz Alta 3D] Cache local não lido', e); }
  if (temGAS() && estado.gas.cache && estado.gas.cache.existe) {
    try {
      carga.progresso(0.3, 'Lendo o mapa salvo no servidor');
      const r = await gs('obterCacheCidade');
      if (r && r.existe && r.gz) {
        const dados = JSON.parse(await descomprimirBase64Gzip(r.gz));
        if (dados && Array.isArray(dados.el)) { salvarCacheLocal(dados); return { dados, origem: 'servidor', data: dados.geradoEm || r.atualizadoEm }; }
      }
    } catch (e) { console.warn('[Cruz Alta 3D] Cache do servidor não lido', e); }
  }
  try {
    carga.progresso(0.6, 'Procurando retrato publicado no repositório');
    const resp = await comTempo(fetch(URL_RETRATO_REPO, { cache: 'no-cache' }), 9000, 'Repositório demorou');
    if (resp.ok) {
      const bruto = await resp.json();
      const dados = Array.isArray(bruto.el) ? bruto : (Array.isArray(bruto.elements) ? compactarOSM(bruto) : null);
      if (dados && dados.el.length) { salvarCacheLocal(dados); return { dados, origem: 'repositorio', data: dados.geradoEm }; }
    }
  } catch (e) { console.info('[Cruz Alta 3D] Sem retrato no repositório', e.message); }
  return null;
}
async function aplicarDadosOSM(dados, origem, data) {
  const modelo = processarOSM(dados);
  if (modelo.contagem.ruas < 30) throw new Error('Os dados têm poucas ruas (' + modelo.contagem.ruas + '). Confira se o arquivo é de Cruz Alta.');
  estado.modelo = modelo;
  estado.dadosCompactos = Array.isArray(dados.el) ? dados : compactarOSM(dados);
  estado.fonte = 'osm';
  estado.fonteInfo = { origem, data: data || modelo.geradoEm || new Date().toISOString() };
  estado.erroDownload = '';
  prepararContexto();
  casarUnidadesOSM(estado.unidades, modelo.pois, estado.bairros);
  resolverPosicoes();
  await reconstruirCidade({});
  atualizarRede(); montarIndiceBusca(); atualizarBanner(); atualizarChipFonte(); renderDados(); renderListaBairros(); montarRotulos(); atualizarLegenda();
}
async function baixarMapaReal(opcoes) {
  if (estado.baixando) return;
  const o = opcoes || {};
  if (temGAS() && !o.soNavegador) {
    estado.baixando = { abort() {}, signal: null, servidor: true };
    atualizarChipFonte(); atualizarBanner();
    const veio = await baixarMapaServidor(!!o.forcar, true);
    estado.baixando = null;
    if (veio) { atualizarChipFonte(); atualizarBanner(); return; }
  }
  estado.baixando = new AbortController();
  atualizarChipFonte(); atualizarBanner();
  mostrarTarefa('Consultando o OpenStreetMap', 0.02, true);
  try {
    const r = await baixarOverpass((p) => {
      if (p.fase === 'consultando') mostrarTarefa('Consultando o OpenStreetMap (servidor ' + (p.i + 1) + ' de ' + p.total + ')', 0.04, true);
      else if (p.fase === 'recebendo') mostrarTarefa('Recebendo o mapa real · ' + fmtBytes(p.bytes), clamp(p.bytes / 9e6, 0.06, 0.9), true);
      else mostrarTarefa('Lendo os dados recebidos', 0.94, true);
    }, estado.baixando.signal);
    const compacto = compactarOSM(r.json);
    estado.baixando = null;
    await aplicarDadosOSM(compacto, 'overpass', compacto.geradoEm);
    salvarCacheLocal(compacto);
    toast('ok', 'Mapa real de Cruz Alta carregado', fmtNum(estado.modelo.contagem.ruas) + ' vias e ' + fmtNum(estado.modelo.contagem.predios) + ' prédios do OpenStreetMap.');
  } catch (e) {
    const cancelado = e && e.name === 'AbortError';
    estado.baixando = null;
    if (cancelado) toast('info', 'Download cancelado', 'A maquete atual foi mantida.');
    else {
      console.warn('[Cruz Alta 3D] Download do OSM falhou', e);
      estado.erroDownload = (e && e.message) || 'Falha desconhecida';
      toast('alerta', 'Não foi possível baixar o mapa real agora', 'Seguimos com o traçado ilustrativo. Tente de novo na aba Dados.');
    }
  } finally {
    estado.baixando = null;
    ocultarTarefa(); atualizarChipFonte(); atualizarBanner(); renderDados();
  }
}
async function baixarMapaServidor(forcar, silencioso) {
  if (!temGAS()) return false;
  try {
    mostrarTarefa('Pedindo o mapa ao servidor do Apps Script', 0.5, false);
    const r = await gs('buscarCidadeServidor', !!forcar);
    if (!r || !r.gz) throw new Error('O servidor não devolveu dados');
    const dados = JSON.parse(await descomprimirBase64Gzip(r.gz));
    await aplicarDadosOSM(dados, 'servidor', dados.geradoEm || r.atualizadoEm);
    salvarCacheLocal(dados);
    estado.gas.cache = { existe: true, atualizadoEm: r.atualizadoEm, bytes: r.bytes };
    toast('ok', 'Mapa real carregado pelo servidor', fmtNum(estado.modelo.contagem.predios) + ' prédios do OpenStreetMap.');
    return true;
  } catch (e) {
    console.warn('[Cruz Alta 3D] Servidor não trouxe o mapa', e);
    if (!silencioso) toast('erro', 'O servidor não conseguiu baixar o mapa', e.message);
    return false;
  } finally { ocultarTarefa(); renderDados(); }
}
async function importarArquivo(arquivo) {
  if (!arquivo) return;
  if (arquivo.size > 120 * 1024 * 1024) { toast('erro', 'Arquivo grande demais', 'O limite é 120 MB.'); return; }
  try {
    mostrarTarefa('Lendo ' + arquivo.name, 0.2, false);
    const texto = await arquivo.text();
    const bruto = JSON.parse(texto);
    const dados = Array.isArray(bruto.el) ? bruto : (Array.isArray(bruto.elements) ? compactarOSM(bruto) : null);
    if (!dados) throw new Error('O arquivo não parece ser um JSON do Overpass nem uma exportação do Cruz Alta 3D.');
    await aplicarDadosOSM(dados, 'importado', dados.geradoEm || new Date().toISOString());
    const salvou = await salvarCacheLocal(dados);
    toast('ok', 'Mapa importado', fmtNum(estado.modelo.contagem.ruas) + ' vias · ' + fmtNum(estado.modelo.contagem.predios) + ' prédios' + (salvou ? ' · cópia salva neste navegador' : ''));
  } catch (e) {
    toast('erro', 'Não foi possível importar', e.message);
  } finally { ocultarTarefa(); $('#arquivoImportar').value = ''; }
}

function enquadrarRede() {
  const us = estado.unidades.filter(u => u.pos && u.ativo !== false && filtroAceita(u.tipo));
  if (!us.length) { toast('alerta', 'Nenhuma unidade posicionada neste filtro'); return; }
  let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
  for (const u of us) { a = Math.min(a, u.pos.x); b = Math.min(b, u.pos.z); c = Math.max(c, u.pos.x); d = Math.max(d, u.pos.z); }
  voarPara((a + c) / 2, (b + d) / 2, clamp(Math.max(c - a, d - b) * 1.25, 900, 16000), { duracao: 1300 });
}
function ligarEventosUI() {
  $('#btnMenu').addEventListener('click', () => alternarEsq());

  $$('#trilhoEsq [data-acao], #trilhoEsq [data-secao]').forEach(b => b.addEventListener('click', () => {

  $$('.rolar-btns').forEach(caixa => {
    const alvo = $('#' + caixa.dataset.alvo);
    alvo.addEventListener('scroll', atualizarBotoesRolar, { passive: true });

    }));
  });
  new ResizeObserver(() => atualizarBotoesRolar()).observe($('#rolagemDir'));

  $('#btnTema').addEventListener('click', alternarTema);
