  $('#btnFonteMais').addEventListener('click', () => { estado.ui.zoom = arred(clamp(estado.ui.zoom + 0.075, 0.85, 1.45), 3); aplicarZoom(); salvarUI(); });

  const campo = $('#campoBusca');
  campo.addEventListener('input', mostrarResultados);
  campo.addEventListener('focus', () => { if (campo.value.trim()) mostrarResultados(); });
  campo.addEventListener('blur', () => setTimeout(() => { $('#resultadosBusca').hidden = true; }, 160));
  campo.addEventListener('keydown', (ev) => {
    const caixa = $('#resultadosBusca');
    const lista = caixa._lista || [];
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      if (!lista.length) return;
      resultadoAtivo = (resultadoAtivo + (ev.key === 'ArrowDown' ? 1 : -1) + lista.length) % lista.length;
      $$('.res-item', caixa).forEach((b, i) => b.classList.toggle('ativo', i === resultadoAtivo));
      const at = $$('.res-item', caixa)[resultadoAtivo];
      if (at) rolarPara(at, 'nearest');
    } else if (ev.key === 'Enter') { ev.preventDefault(); escolherResultado(lista[Math.max(0, resultadoAtivo)]); }
    else if (ev.key === 'Escape') { campo.value = ''; caixa.hidden = true; campo.blur(); }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === '/' && !editavel(document.activeElement) && !ev.ctrlKey && !ev.metaKey) { ev.preventDefault(); focar(campo); campo.select(); return; }
    if (ev.key === 'Escape') {
      if (estado.posicionando) { cancelarPosicionamento(); return; }
      if (tour.ativo) { pararTour(); return; }
      if ($('#app').classList.contains('gaveta-esq') || $('#app').classList.contains('gaveta-dir')) { fecharGavetas(); return; }
    }
  });

  $('#btnAproximar').addEventListener('click', () => aproximar(0.55));
  $('#btnAfastar').addEventListener('click', () => aproximar(1.8));
  $('#btnVistaTopo').addEventListener('click', alternarVistaTopo);
  $('#btnReiniciarVista').addEventListener('click', () => vistaCidadeInteira(true));
  $('#btnFoto').addEventListener('click', baixarImagem);
  $('#btnBussola').addEventListener('click', apontarNorte);
  $('#btnNavegacao').addEventListener('click', () => {
    estado.cfg.navegacao = estado.cfg.navegacao === 'orbita' ? 'mapa' : 'orbita';
    aplicarModoNavegacao(estado.cfg.navegacao);
    salvarCfgLocal();
    $$('#segNavegacao button').forEach(x => x.classList.toggle('ativo', x.dataset.v === estado.cfg.navegacao));
    toast('info', estado.cfg.navegacao === 'orbita' ? 'Modo órbita' : 'Modo mapa',
      estado.cfg.navegacao === 'orbita' ? 'Arrastar gira a vista; botão direito move.' : 'Arrastar move o mapa; botão direito ou dois dedos giram.', 3200);
  });
  const faixaHora = $('#horaRapidaRange');
  faixaHora.addEventListener('input', () => { estado.cfg.hora = parseFloat(faixaHora.value); aplicarLuz(); });
  faixaHora.addEventListener('change', salvarCfgLocal);
  $('#btnAnimarDia').addEventListener('click', () => { estado.cfg.animarDia = !estado.cfg.animarDia; atualizarHoraUI(); });

  $('#btnBannerBaixar').addEventListener('click', () => baixarMapaReal({ forcar: true }));
  $('#btnBannerFechar').addEventListener('click', () => { estado.bannerOculto = true; atualizarBanner(); });
  $('#btnCancelarPosicionar').addEventListener('click', cancelarPosicionamento);
  $('#btnCancelarDownload').addEventListener('click', () => { if (estado.baixando) estado.baixando.abort(); });
  $('#btnTour').addEventListener('click', () => { if (tour.ativo) pararTour(); else iniciarTour(); });
  $('#btnVerRede').addEventListener('click', enquadrarRede);
  $('#filtroBairros').addEventListener('input', debounce(renderListaBairros, 120));
  $('#arquivoImportar').addEventListener('change', (ev) => importarArquivo(ev.target.files && ev.target.files[0]));

  const palco = $('#palco');
  let toque = null;
  palco.addEventListener('pointerdown', (ev) => { toque = { x: ev.clientX, y: ev.clientY, t: performance.now(), botao: ev.button }; });
  palco.addEventListener('pointerup', (ev) => {
    if (!toque || !cena.pronta) return;
    const mov = Math.hypot(ev.clientX - toque.x, ev.clientY - toque.y);
    const dur = performance.now() - toque.t;
    const botao = toque.botao;
    toque = null;
    if (mov < 6 && dur < 650 && botao === 0) aoClicarMapa(ev);
  });
  const aoMudarTela = () => { fecharGavetas(); aplicarLarguras(); cena.redimensionar = true; };
  if (mqTablet.addEventListener) { mqTablet.addEventListener('change', aoMudarTela); mqCelular.addEventListener('change', aoMudarTela); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) cena.precisaRender = true; });
}

function webglDisponivel() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
  } catch (e) { return false; }
}

async function iniciar() {
  window.addEventListener('unhandledrejection', (ev) => console.error('[Cruz Alta 3D] Promessa rejeitada', ev.reason));
  estado.ui = Object.assign({}, UI_PADRAO, lerLocal(CHAVE_UI, {}));
  aplicarZoom(); aplicarTemaIcone(); aplicarLarguras();
  ['#imgBrasao', '#imgBrasaoCarga'].forEach(sel => {
    const img = $(sel);
    img.addEventListener('error', () => img.classList.add('falhou'));
    img.src = URL_BRASAO;
  });
  ligarGuardasRolagem();
  montarCamadasUI();
  ligarEventosUI();
  renderGuia();
  abrirAba(['selecao', 'ajustes', 'dados', 'guia'].indexOf(estado.ui.aba) >= 0 ? estado.ui.aba : 'selecao', false);
  atualizarBotaoTour();
  estado.params = await lerParametros();
  if (estado.params.painel === '0') { estado.ui.esqOff = true; estado.ui.dirOff = true; aplicarLarguras(); }

  carga.iniciar([
    { id: 'lib', rotulo: 'Biblioteca 3D (three.js)', peso: 10 },
    { id: 'bairros', rotulo: 'Bairros oficiais (IBGE 2022)', peso: 6 },
    { id: 'dados', rotulo: 'Mapa da cidade', peso: 12 },
    { id: 'gerar', rotulo: 'Ruas, lotes e prédios', peso: 62 },
    { id: 'malha', rotulo: 'Montagem da maquete', peso: 10 }
  ]);
  carga.passo('lib', 'Carregando a biblioteca 3D');
  try {
    await carregarScript(CDN_THREE, () => !!window.THREE, 25000);
    carga.progresso(0.6);
    await carregarScript(CDN_CONTROLES, () => !!(window.THREE && THREE.OrbitControls), 20000);
  } catch (e) {
    carga.erro('Não foi possível carregar a biblioteca 3D.',
      'Confira a internet ou se a rede bloqueia cdn.jsdelivr.net e unpkg.com. Detalhe: ' + e.message,
      [{ rotulo: 'Tentar novamente', icone: 'atualizar', classe: 'prim', acao: () => location.reload() }]);
    atualizarChipFonte();
    return;
  }
  if (!webglDisponivel()) {
    carga.erro('Este navegador não oferece gráficos 3D (WebGL).',
      'Ative a aceleração de hardware nas configurações do navegador ou use Chrome, Edge ou Firefox atualizados.',
      [{ rotulo: 'Tentar novamente', icone: 'atualizar', classe: 'prim', acao: () => location.reload() }]);
    return;
  }

  carga.passo('bairros', 'Preparando os ' + BAIRROS_IBGE.length + ' bairros do IBGE');
  await proximoQuadro();
  estado.bairros = prepararBairros();
  if (temGAS()) {
    try {
      carga.progresso(0.5, 'Lendo a planilha da rede de saúde');
      aplicarContextoGAS(await comTempo(gs('obterContextoInicial'), 45000, 'A planilha demorou a responder'));
    } catch (e) {
      console.warn('[Cruz Alta 3D] Planilha indisponível', e);
      toast('alerta', 'Planilha da rede indisponível', 'Usando a lista padrão de unidades. ' + e.message);
    }
  }
  estado.cfg = montarConfig();
  estado.unidades = montarUnidades(estado.gas.unidades);
  prepararContexto();
  criarCena($('#palco'), qualidadeAtual());
  estado.ctxGeracao.maxTextura = cena.renderer.capabilities.maxTextureSize || 4096;
  cena.renderer.domElement.addEventListener('webglcontextlost', (ev) => {
    ev.preventDefault();
    carga.erro('A maquete perdeu o contexto gráfico.', 'Isso acontece quando falta memória de vídeo. Recarregue a página ou escolha a qualidade Baixa em Ajustes.',
      [{ rotulo: 'Recarregar', icone: 'atualizar', classe: 'prim', acao: () => location.reload() }]);
  });
  montarLimites(estado.bairros);

  carga.passo('dados', 'Procurando o mapa real de Cruz Alta');
  let inicial = null;
  if (estado.params.modo !== 'ilustrativo') inicial = await obterDadosIniciais();
  if (inicial) {
    try {
      estado.modelo = processarOSM(inicial.dados);
      if (estado.modelo.contagem.ruas < 30) throw new Error('poucas ruas');
      estado.dadosCompactos = inicial.dados;
      estado.fonte = 'osm';
      estado.fonteInfo = { origem: inicial.origem, data: inicial.data };
      prepararContexto();
      casarUnidadesOSM(estado.unidades, estado.modelo.pois, estado.bairros);
    } catch (e) {
      console.warn('[Cruz Alta 3D] Cópia salva inválida', e);
      estado.modelo = null; estado.dadosCompactos = null; inicial = null;
    }
  }
  if (!inicial) {
    estado.fonte = 'ilustrativo';
    estado.fonteInfo = { origem: 'ilustrativo', data: null };
    carga.progresso(1, 'Começando pelo traçado ilustrativo dentro dos bairros reais');
  }
  resolverPosicoes();

  carga.passo('gerar', 'Gerando a cidade');
  try { await reconstruirCidade({ inicial: true }); }
  catch (e) {
    carga.erro('Não foi possível montar a cidade.', e.message, [{ rotulo: 'Tentar novamente', icone: 'atualizar', classe: 'prim', acao: () => location.reload() },
      { rotulo: 'Usar qualidade baixa', icone: 'raio', acao: () => { estado.cfg.qualidade = 'baixa'; salvarCfgLocal(); location.reload(); } }]);
    return;
  }
  carga.passo('malha', 'Montando a maquete');
  await proximoQuadro();
  montarIndiceBusca();
  atualizarRede();
  renderListaBairros();
  montarAjustesUI();
  renderDados();
  renderSelecao();
  atualizarBanner();
  atualizarChipFonte();
  atualizarLegenda();
  aplicarLuz();
  vistaInicial();
  new ResizeObserver(() => { cena.redimensionar = true; }).observe($('#palco'));
  requestAnimationFrame(laco);
  carga.concluir();

  const p = estado.params;
  if (p.unidade) setTimeout(() => selecionarItemMapa('u:' + p.unidade, { voar: true }), 500);
  else if (p.bairro) { const b = bairroPorNome(estado.bairros, p.bairro); if (b) setTimeout(() => selecionarBairro(b.i, { voar: true }), 500); }
  if (estado.fonte === 'ilustrativo' && estado.cfg.baixarAuto && p.modo !== 'ilustrativo') setTimeout(() => baixarMapaReal({}), 900);
  window.__ca3d = { estado, cena, versao: VERSAO, interno: { gerarCidade, Grade, OC, prepararBairros, processarOSM, compactarOSM, estadoSolar, urbanizacao, gerarRuasIlustrativas, qualidadeAtual, caixaDosBairros, voarPara, aplicarLuz, aplicarExagero, selecionarItemMapa, selecionarBairro } };
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
else iniciar();

})();
